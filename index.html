<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>대곽마블</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #151515;
    color: white;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================
   공통
   ========================= */

.screen {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}

.hidden {
    display: none !important;
}

.panel {
    width: min(520px, 100%);

    padding: 28px;

    background: #242424;

    border-radius: 20px;

    box-shadow: 0 12px 40px #0008;
}

h1,
h2 {
    margin-top: 0;
}

input {
    width: 100%;

    padding: 13px 15px;

    margin-bottom: 10px;

    border: 1px solid #555;
    border-radius: 10px;

    background: #171717;
    color: white;

    outline: none;
}

button {
    border: 0;
    border-radius: 10px;

    padding: 12px 16px;

    background: white;
    color: #111;

    font-weight: 700;
}

.row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.row > * {
    flex: 1;
}

.status {
    color: #bbb;
    font-size: 14px;
    margin: 8px 0;
}

.error {
    color: #ff7d7d;
    white-space: pre-wrap;
}

/* =========================
   대기실
   ========================= */

.room-code {
    font-size: 32px;
    font-weight: 900;

    letter-spacing: 5px;
    text-align: center;

    padding: 12px;

    background: #111;

    border-radius: 12px;

    margin: 12px 0 20px;
}

#players {
    display: flex;
    flex-direction: column;

    gap: 8px;

    margin: 10px 0 20px;
}

.player {
    background: #181818;

    padding: 10px 12px;

    border-radius: 9px;

    display: flex;
    justify-content: space-between;
}

.pieces {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(100px, 1fr));

    gap: 10px;

    margin-top: 10px;
}

.piece {
    min-height: 100px;

    padding: 8px;

    background: #171717;

    border: 2px solid transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 5px;
}

.piece.selected {
    border-color: white;
}

.piece img {
    max-width: 70px;
    max-height: 70px;
}

.piece small {
    font-size: 12px;
    color: #aaa;
}

/* =========================
   게임 화면
   ========================= */

#gameScreen {
    display: none;

    min-height: 100vh;

    padding:
        25px
        120px
        15px
        15px;

    align-items: center;

    overflow: auto;
}

#gameScreen.active {
    display: flex;

    flex-direction: column;
}

.board-wrap {
    position: relative;

    width: min(100%, 1100px);

    flex-shrink: 0;
}

.board-image {
    display: block;

    width: 100%;
    height: auto;

    user-select: none;
    -webkit-user-drag: none;
}

/* =========================
   턴 순서
   ========================= */

#turnOrder {
    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 200;

    display: flex;

    gap: 8px;

    max-width: calc(100vw - 30px);

    overflow-x: auto;

    padding: 5px;
}

.turn-player {
    min-width: 72px;

    padding: 6px;

    background: rgba(0, 0, 0, 0.78);

    border: 2px solid transparent;

    border-radius: 9px;

    text-align: center;

    transition: 0.15s;
}

.turn-player.current {
    border-color: white;
    transform: scale(1.08);
}

.turn-piece {
    width: 42px;
    height: 42px;

    object-fit: contain;
}

.turn-name {
    display: block;

    max-width: 68px;

    margin-top: 3px;

    font-size: 11px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   주사위
   ========================= */

#diceArea {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    z-index: 20;

    pointer-events: none;
}

.dice {
    width: 30%;
    height: 30%;

    min-width: 120px;
    min-height: 120px;

    max-width: 260px;
    max-height: 260px;

    object-fit: contain;

    opacity: 0.8;
}

#turnControls {
    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    z-index: 300;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 7px;
}

#rollDiceButton {
    min-width: 170px;

    padding: 13px 22px;

    border-radius: 12px;
}

#turnMessage {
    padding: 7px 12px;

    background: rgba(0, 0, 0, 0.8);

    border-radius: 8px;

    font-size: 13px;
}

/* =========================
   말
   ========================= */

.board-piece {
    position: absolute;

    width: 6%;
    height: 6%;

    min-width: 28px;
    min-height: 28px;

    max-width: 65px;
    max-height: 65px;

    object-fit: contain;

    transform: translate(-50%, -50%);

    z-index: 10;

    user-select: none;
    -webkit-user-drag: none;

    touch-action: none;
}

.board-piece.draggable {
    cursor: grab;
}

.board-piece.draggable:active {
    cursor: grabbing;
}

/* =========================
   돈 패널
   ========================= */

#moneyPanel {
    position: fixed;

    top: 15px;
    right: 15px;

    width: 470px;
    max-width: calc(100vw - 30px);

    padding: 12px;

    background: rgba(0, 0, 0, 0.82);

    border: 2px solid rgba(255, 255, 255, 0.75);

    border-radius: 12px;

    z-index: 250;

    color: white;
}

/* 돈 5종 */

#moneySelector {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 5px;
}

.money-type {
    width: 19%;

    display: flex;

    flex-direction: column;

    align-items: center;
}

.money-image {
    width: 65px;
    height: 65px;

    max-width: 100%;

    object-fit: contain;

    margin-bottom: 4px;
}

/* ▲ ▼ 버튼 */

.amount-up,
.amount-down {
    width: 32px;
    height: 23px;

    padding: 0;

    border-radius: 5px;

    border: 1px solid rgba(255, 255, 255, 0.8);

    background: rgba(255, 255, 255, 0.13);

    color: white;

    font-size: 13px;

    line-height: 1;
}

.amount-up:hover,
.amount-down:hover {
    background: rgba(255, 255, 255, 0.28);
}

/* 수량 */

.money-count {
    width: 40px;
    height: 28px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 16px;

    font-weight: 800;
}

/* 선택 금액 */

#selectedMoneyArea {
    margin-top: 10px;

    padding-top: 9px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.3);

    display: flex;

    align-items: center;

    gap: 7px;

    flex-wrap: wrap;
}

.selected-money-label {
    font-size: 13px;
}

#selectedMoney {
    min-width: 100px;

    font-size: 18px;

    font-weight: 900;
}

.money-action-button {
    padding: 7px 13px;

    border-radius: 7px;

    background: rgba(255, 255, 255, 0.14);

    color: white;

    border:
        1px solid
        rgba(255, 255, 255, 0.8);
}

.money-action-button:hover {
    background: rgba(255, 255, 255, 0.28);
}

/* =========================
   잔고
   ========================= */

#balanceList {
    margin-top: 10px;

    padding-top: 9px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.3);

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.balance-player {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 4px 7px;

    font-size: 13px;

    border-radius: 5px;
}

.balance-player.me {
    background: rgba(255, 255, 255, 0.13);

    font-weight: 800;
}

.balance-name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.balance-money {
    margin-left: 10px;

    white-space: nowrap;

    font-weight: 800;
}

/* =========================
   사회복지기금
   ========================= */

#welfareArea {
    margin-top: 9px;

    padding-top: 9px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.3);
}

#welfareText {
    font-size: 14px;

    margin-bottom: 7px;
}

#welfareFund {
    font-size: 17px;

    font-weight: 900;
}

#welfareButtons {
    display: flex;

    gap: 7px;
}

#welfareButtons button {
    padding: 6px 11px;

    border-radius: 7px;

    background: rgba(255, 255, 255, 0.14);

    color: white;

    border:
        1px solid
        rgba(255, 255, 255, 0.8);
}

#welfareButtons button:hover {
    background: rgba(255, 255, 255, 0.28);
}

/* =========================
   모바일
   ========================= */

@media (max-width: 700px) {

    #gameScreen {
        padding:
            100px
            10px
            90px
            10px;
    }

    #moneyPanel {
        top: 10px;
        right: 10px;

        width: calc(100vw - 20px);

        padding: 8px;
    }

    .money-image {
        width: 48px;
        height: 48px;
    }

    .amount-up,
    .amount-down {
        width: 28px;
        height: 21px;
    }

    .money-count {
        height: 25px;
    }

    #turnOrder {
        top: auto;
        bottom: 75px;
        left: 50%;

        transform: translateX(-50%);

        width: calc(100vw - 20px);

        justify-content: center;
    }

    .turn-player {
        min-width: 58px;
    }

    .turn-piece {
        width: 32px;
        height: 32px;
    }

    .dice {
        min-width: 90px;
        min-height: 90px;

        max-width: 180px;
        max-height: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================
     닉네임 화면
     ========================= -->

<div id="loginScreen" class="screen">

    <div class="panel">

        <h1>대곽마블</h1>

        <p>닉네임을 입력한다.</p>

        <input
            id="nickname"
            maxlength="12"
            placeholder="닉네임"
        >

        <div class="row">

            <button id="createBtn">
                방 만들기
            </button>

            <button id="showJoinBtn">
                방 들어가기
            </button>

        </div>

        <div
            id="joinBox"
            class="hidden"
            style="margin-top:15px"
        >

            <input
                id="roomInput"
                maxlength="6"
                placeholder="방 코드"
            >

            <button
                id="joinBtn"
                style="width:100%"
            >
                입장
            </button>

        </div>

        <p
            id="loginError"
            class="error"
        ></p>

    </div>

</div>


<!-- =========================
     대기실
     ========================= -->

<div
    id="roomScreen"
    class="screen hidden"
>

    <div class="panel">

        <h2>방 대기실</h2>

        <div class="status">
            방 코드
        </div>

        <div
            id="roomCode"
            class="room-code"
        ></div>

        <h3>참가자</h3>

        <div id="players"></div>

        <h3>말 선택</h3>

        <div
            id="pieces"
            class="pieces"
        ></div>

        <p
            id="roomStatus"
            class="status"
        ></p>

        <button
            id="startBtn"
            style="width:100%;margin-top:15px"
            disabled
        >
            게임 시작
        </button>

    </div>

</div>


<!-- =========================
     게임 화면
     ========================= -->

<div id="gameScreen">

    <!-- 턴 순서 -->

    <div id="turnOrder"></div>


    <!-- 돈 / 잔고 패널 -->

    <div id="moneyPanel">

        <div id="moneySelector">

            <div class="money-type">

                <img
                    src="money/1.png"
                    class="money-image"
                    alt="1만원"
                >

                <button
                    class="amount-up"
                    onclick="changeMoneyCount(1, 1)"
                >▲</button>

                <div
                    class="money-count"
                    id="moneyCount1"
                >0</div>

                <button
                    class="amount-down"
                    onclick="changeMoneyCount(1, -1)"
                >▼</button>

            </div>


            <div class="money-type">

                <img
                    src="money/2.png"
                    class="money-image"
                    alt="2만원"
                >

                <button
                    class="amount-up"
                    onclick="changeMoneyCount(2, 1)"
                >▲</button>

                <div
                    class="money-count"
                    id="moneyCount2"
                >0</div>

                <button
                    class="amount-down"
                    onclick="changeMoneyCount(2, -1)"
                >▼</button>

            </div>


            <div class="money-type">

                <img
                    src="money/5.png"
                    class="money-image"
                    alt="5만원"
                >

                <button
                    class="amount-up"
                    onclick="changeMoneyCount(5, 1)"
                >▲</button>

                <div
                    class="money-count"
                    id="moneyCount5"
                >0</div>

                <button
                    class="amount-down"
                    onclick="changeMoneyCount(5, -1)"
                >▼</button>

            </div>


            <div class="money-type">

                <img
                    src="money/10.png"
                    class="money-image"
                    alt="10만원"
                >

                <button
                    class="amount-up"
                    onclick="changeMoneyCount(10, 1)"
                >▲</button>

                <div
                    class="money-count"
                    id="moneyCount10"
                >0</div>

                <button
                    class="amount-down"
                    onclick="changeMoneyCount(10, -1)"
                >▼</button>

            </div>


            <div class="money-type">

                <img
                    src="money/50.png"
                    class="money-image"
                    alt="50만원"
                >

                <button
                    class="amount-up"
                    onclick="changeMoneyCount(50, 1)"
                >▲</button>

                <div
                    class="money-count"
                    id="moneyCount50"
                >0</div>

                <button
                    class="amount-down"
                    onclick="changeMoneyCount(50, -1)"
                >▼</button>

            </div>

        </div>


        <!-- 선택 금액 -->

        <div id="selectedMoneyArea">

            <span class="selected-money-label">
                선택 금액:
            </span>

            <strong id="selectedMoney">
                0원
            </strong>

            <button
                class="money-action-button"
                onclick="receiveMoney()"
            >
                받기
            </button>

            <button
                class="money-action-button"
                onclick="payMoney()"
            >
                내기
            </button>

        </div>


        <!-- 플레이어 잔고 -->

        <div id="balanceList"></div>


        <!-- 사회복지기금 -->

        <div id="welfareArea">

            <div id="welfareText">
                사회복지기금 =
                <strong id="welfareFund">
                    0원
                </strong>
            </div>

            <div id="welfareButtons">

                <button onclick="payWelfareFund()">
                    기금 내기
                </button>

                <button onclick="receiveWelfareFund()">
                    기금 받기
                </button>

            </div>

        </div>

    </div>


    <!-- 게임판 -->

    <div class="board-wrap">

        <img
            src="board.png"
            class="board-image"
            alt="대곽마블 게임판"
        >


        <!-- 주사위 -->

        <div id="diceArea">

            <img
                id="dice1"
                class="dice"
                src="dice/dice1.png"
                alt="주사위"
            >

            <img
                id="dice2"
                class="dice"
                src="dice/dice1.png"
                alt="주사위"
            >

        </div>

    </div>


    <!-- 턴 컨트롤 -->

    <div id="turnControls">

        <div id="turnMessage">
            게임 준비 중
        </div>

        <button
            id="rollDiceButton"
            onclick="rollDice()"
            style="display:none"
        >
            주사위 굴리기
        </button>

    </div>

</div>


<script type="module">

/* =========================================================
   Firebase
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    onValue,
    onDisconnect,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAgifEo4ulWFIoqYppZjs60xqVAXK-u31U",

    authDomain:
        "dshs-marble.firebaseapp.com",

    databaseURL:
        "https://dshs-marble-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dshs-marble",

    storageBucket:
        "dshs-marble.firebasestorage.app",

    messagingSenderId:
        "567950560406",

    appId:
        "1:567950560406:web:6470f6c91d8ad73e45c6b7"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================================================
   기본 상태
   ========================================================= */

const state = {

    nickname: "",
    roomCode: "",
    playerId: "",

    selectedPiece: null,

    players: [],
    pieces: [],

    isHost: false,

    turnOrder: [],
    currentTurnIndex: 0,

    gameStarted: false,

    diceRolling: false,
    lastDiceRollId: null,

    welfareFund: 0,

    dragging: false

};


/* =========================================================
   DOM
   ========================================================= */

const $ = id =>
    document.getElementById(id);


const loginScreen =
    $("loginScreen");

const roomScreen =
    $("roomScreen");

const gameScreen =
    $("gameScreen");


const boardWrapper =
    document.querySelector(".board-wrap");


/* =========================================================
   플레이어 ID
   ========================================================= */

function getPlayerId() {

    let id =
        localStorage.getItem("dshsMarblePlayerId");

    if (!id) {

        id =
            "player_" +
            Math.random()
                .toString(36)
                .substring(2) +
            Date.now().toString(36);

        localStorage.setItem(
            "dshsMarblePlayerId",
            id
        );

    }

    return id;
}


state.playerId =
    getPlayerId();


/* =========================================================
   유틸리티
   ========================================================= */

function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString("ko-KR") + "원";

}


function cleanRoomCode(value) {

    return value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

}


function makeRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return code;

}


function randomDiceValue() {

    return Math.floor(
        Math.random() * 6
    ) + 1;

}


/* =========================================================
   닉네임
   ========================================================= */

function getNickname() {

    return $("nickname")
        .value
        .trim();

}


function showLoginError(message) {

    $("loginError")
        .textContent = message;

}


/* =========================================================
   방 만들기
   ========================================================= */

async function createRoom() {

    const nickname =
        getNickname();

    if (!nickname) {

        showLoginError(
            "닉네임을 입력해야 한다."
        );

        return;

    }


    try {

        let code;
        let exists = true;


        for (
            let i = 0;
            i < 20 && exists;
            i++
        ) {

            code =
                makeRoomCode();

            const snapshot =
                await get(
                    ref(
                        db,
                        `rooms/${code}`
                    )
                );

            exists =
                snapshot.exists();

        }


        if (exists) {

            throw new Error(
                "방 코드 생성에 실패했다."
            );

        }


        state.nickname =
            nickname;

        state.roomCode =
            code;

        state.isHost =
            true;


        await set(
            ref(
                db,
                `rooms/${code}`
            ),
            {

                hostId:
                    state.playerId,

                gameStarted:
                    false,

                createdAt:
                    Date.now(),

                dice1:
                    1,

                dice2:
                    1,

                diceRolling:
                    false,

                diceRollId:
                    null,

                currentTurnIndex:
                    0,

                turnOrder:
                    [],

                welfareFund:
                    0,

                players: {

                    [state.playerId]: {

                        playerId:
                            state.playerId,

                        nickname:
                            state.nickname,

                        piece:
                            null,

                        x:
                            null,

                        y:
                            null,

                        balance:
                            2900000,

                        joinedAt:
                            Date.now()

                    }

                }

            }
        );


        setupDisconnect();

        enterRoom();

    } catch (error) {

        console.error(error);

        showLoginError(
            "방을 만들 수 없다.\n" +
            error.message
        );

    }

}


/* =========================================================
   방 참가
   ========================================================= */

async function joinRoom() {

    const nickname =
        getNickname();

    const code =
        cleanRoomCode(
            $("roomInput").value
        );


    if (!nickname) {

        showLoginError(
            "닉네임을 입력해야 한다."
        );

        return;

    }


    if (code.length !== 6) {

        showLoginError(
            "방 코드는 6자리다."
        );

        return;

    }


    try {

        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        const snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            showLoginError(
                "존재하지 않는 방이다."
            );

            return;

        }


        const data =
            snapshot.val();


        if (data.gameStarted) {

            showLoginError(
                "이미 시작된 게임이다."
            );

            return;

        }


        const players =
            data.players || {};


        if (
            Object.keys(players).length >= 5
        ) {

            showLoginError(
                "플레이어는 최대 5명까지 참가할 수 있다."
            );

            return;

        }


        state.nickname =
            nickname;

        state.roomCode =
            code;

        state.isHost =
            false;


        await set(
            ref(
                db,
                `rooms/${code}/players/${state.playerId}`
            ),
            {

                playerId:
                    state.playerId,

                nickname:
                    state.nickname,

                piece:
                    null,

                x:
                    null,

                y:
                    null,

                balance:
                    2900000,

                joinedAt:
                    Date.now()

            }
        );


        setupDisconnect();

        enterRoom();

    } catch (error) {

        console.error(error);

        showLoginError(
            "방에 들어갈 수 없다.\n" +
            error.message
        );

    }

}

/* =========================================================
   Firebase 방 감시
   ========================================================= */

let watchingRoom = false;


function watchRoom() {

    if (watchingRoom) return;

    watchingRoom = true;


    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    onValue(
        roomRef,
        async snapshot => {

            if (!snapshot.exists()) {

                $("roomStatus")
                    .textContent =
                    "방이 종료되었다.";

                return;

            }


            const data =
                snapshot.val();


            state.players =
                Object.values(
                    data.players || {}
                );


            state.welfareFund =
                data.welfareFund || 0;


            state.turnOrder =
                data.turnOrder || [];


            state.currentTurnIndex =
                data.currentTurnIndex || 0;


            state.gameStarted =
                !!data.gameStarted;


            state.diceRolling =
                !!data.diceRolling;


            renderBalances();


            renderWelfare();


            if (!state.gameStarted) {

                renderRoom();

                return;

            }


            roomScreen.classList.add(
                "hidden"
            );

            gameScreen.classList.add(
                "active"
            );


            renderTurnOrder();


            renderBoardPieces();


            updateTurnControls();


            setDiceImages(
                data.dice1 || 1,
                data.dice2 || 1
            );


            /*
             * 새로운 주사위 굴림을 감지한다.
             */

            if (
                data.diceRollId &&
                data.diceRollId !==
                    state.lastDiceRollId
            ) {

                state.lastDiceRollId =
                    data.diceRollId;


                state.diceRolling =
                    true;


                await animateDice(
                    data.dice1,
                    data.dice2
                );


                /*
                 * 주사위 애니메이션이 끝난 뒤
                 * 방장이 다음 턴으로 넘긴다.
                 */

                if (
                    state.isHost &&
                    data.diceRolling
                ) {

                    await update(
                        roomRef,
                        {

                            diceRolling:
                                false,

                            currentTurnIndex:
                                (
                                    (
                                        data.currentTurnIndex ||
                                        0
                                    ) + 1
                                ) %
                                (
                                    data.turnOrder?.length ||
                                    1
                                )

                        }
                    );

                }

                state.diceRolling =
                    false;

                updateTurnControls();

            }

        }
    );

}

        new Set(

                    player =>
                        player.playerId !==
                        state.playerId
                )
                .map(

                )
                .filter(Boolean)

            )
        ) {

        }


        const img =
            document.createElement(
                "img"
            );

        img.src =
            piece.src;

        img.alt =

            );

        ) {

        }

/* =========================================================
   말 선택
   ========================================================= */

async function selectPiece(pieceId) {

    const playersRef =
        ref(
            db,
            `rooms/${state.roomCode}/players`
        );


    try {

        await runTransaction(
            playersRef,
            players => {

                if (
                    !players ||
                    !players[state.playerId]
                ) {
                    return;
                }


                for (
                    const [
                        playerId,
                        player
                    ]
                    of Object.entries(
                        players
                    )
                ) {

                    if (
                        playerId !==
                            state.playerId &&
                        player.piece ===
                            pieceId
                    ) {

                        return;

                    }

                }


                players[
                    state.playerId
                ].piece =
                    pieceId;


                return players;

            }
        );

    } catch (error) {

        console.error(error);

        $("roomStatus")
            .textContent =
            "말 선택에 실패했다.";

    }

}


/* =========================================================
   게임 시작
   ========================================================= */

async function startGame() {

    if (
        !state.isHost ||
        !state.roomCode
    ) {
        return;
    }


    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    try {

        await runTransaction(
            roomRef,
            room => {

                if (
                    !room ||
                    room.hostId !==
                        state.playerId ||
                    room.gameStarted
                ) {

                    return;

                }


                const players =
                    room.players || {};


                const playerList =
                    Object.values(
                        players
                    );


                if (
                    playerList.length === 0
                ) {
                    return;
                }


                if (
                    !playerList.every(
                        player =>
                            !!player.piece
                    )
                ) {

                    return;

                }


                /*
                 * 시작 잔고가 없는 기존 방에도
                 * 290만원을 넣어준다.
                 */

                for (
                    const player
                    of Object.values(
                        players
                    )
                ) {

                    if (
                        typeof player.balance !==
                        "number"
                    ) {

                        player.balance =
                            2900000;

                    }

                }


                /*
                 * 턴 순서를 무작위로 섞는다.
                 */

                const order =
                    playerList.map(
                        player =>
                            player.playerId
                    );


                shuffle(order);


                room.turnOrder =
                    order;

                room.currentTurnIndex =
                    0;

                room.gameStarted =
                    true;

                room.dice1 =
                    1;

                room.dice2 =
                    1;

                room.diceRolling =
                    false;

                room.diceRollId =
                    null;

                room.welfareFund =
                    room.welfareFund ||
                    0;


                return room;

            }
        );

    } catch (error) {

        console.error(error);

        $("roomStatus")
            .textContent =
            "게임 시작에 실패했다.";

    }

}


/* =========================================================
   배열 섞기
   ========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}

async function rollDice() {

    if (
        state.diceRolling
    ) {
        return;
    }


    const currentPlayerId =
        state.turnOrder[
            state.currentTurnIndex
        ];


    if (
        currentPlayerId !==
        state.playerId
    ) {
        return;
    }


    const final1 =
        randomDiceValue();

    const final2 =
        randomDiceValue();


    state.diceRolling =
        true;


    await update(
        ref(
            db,
            `rooms/${state.roomCode}`
        ),
        {

                final2,

    );

/* =========================================================
   주사위 애니메이션
   ========================================================= */

function animateDice(
    final1,
    final2
) {

    return new Promise(
        resolve => {

            let elapsed = 0;

            let delay = 55;


            function roll() {

                const random1 =
                    randomDiceValue();

                const random2 =
                    randomDiceValue();


                setDiceImages(
                    random1,
                    random2
                );


                elapsed +=
                    delay;


                if (
                    elapsed >= 1500
                ) {

                    setDiceImages(
                        final1,
                        final2
                    );

                    resolve();

                    return;

                }


                delay *= 1.13;


                setTimeout(
                    roll,
                    delay
                );

            }


            roll();

        }
    );

}


/* =========================================================
   보드 말 렌더링
   ========================================================= */

function renderBoardPieces() {

    const oldPieces =
        boardWrapper.querySelectorAll(
            ".board-piece"
        );


    oldPieces.forEach(
        piece =>
            piece.remove()
    );


    /*
     * 현재 플레이어의 말을 먼저 렌더링한다.
     * 따라서 자신의 말이 항상 가장 위에 표시된다.
     */

    const sortedPlayers =
        [...state.players].sort(
            (a, b) => {

                if (
                    a.playerId ===
                    state.playerId
                ) {
                    return -1;
                }

                if (
                    b.playerId ===
                    state.playerId
                ) {
                    return 1;
                }

                return (
                    (a.joinedAt || 0) -
                    (b.joinedAt || 0)
                );

            }
        );


    sortedPlayers.forEach(
        (player, index) => {

            if (
                !player.piece
            ) {
                return;
            }


            const piece =
                state.pieces.find(
                    p =>
                        p.id ===
                        player.piece
                );


            if (!piece) {
                return;
            }


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                piece.src;

            img.alt =
                player.nickname;

            img.className =
                "board-piece";


            /*
             * 좌표가 없으면 보드 중앙 근처에 배치한다.
             */

            if (
                player.x == null ||
                player.y == null
            ) {

                const defaultPositions = [

                    [50, 50],

                    [47, 50],

                    [53, 50],

                    [50, 46],

                    [50, 54]

                ];


                const position =
                    defaultPositions[
                        index %
                        defaultPositions.length
                    ];


                img.style.left =
                    `${position[0]}%`;

                img.style.top =
                    `${position[1]}%`;

            } else {

                img.style.left =
                    `${player.x}%`;

                img.style.top =
                    `${player.y}%`;

            }


            /*
             * 자신의 말만 움직일 수 있게 한다.
             */

            if (
                player.playerId ===
                state.playerId
            ) {

                img.classList.add(
                    "draggable"
                );

                setupPieceDrag(
                    img
                );

                img.style.zIndex =
                    "100";

            } else {

                img.style.zIndex =
                    String(
                        10 + index
                    );

            }


            boardWrapper.appendChild(
                img
            );

        }
    );

}


/* =========================================================
   말 드래그
   ========================================================= */

function setupPieceDrag(img) {

    let dragging = false;


    img.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            dragging = true;

            img.setPointerCapture(
                event.pointerId
            );

            img.style.zIndex =
                "200";

        }
    );


    img.addEventListener(
        "pointermove",
        event => {

            if (!dragging) {
                return;
            }


            event.preventDefault();


            const rect =
                boardWrapper
                    .getBoundingClientRect();


            let x =
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width *
                100;


            let y =
                (
                    event.clientY -
                    rect.top
                ) /
                rect.height *
                100;


            x =
                Math.max(
                    0,
                    Math.min(
                        100,
                        x
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        100,
                        y
                    )
                );


            img.style.left =
                `${x}%`;

            img.style.top =
                `${y}%`;

        }
    );


    img.addEventListener(
        "pointerup",
        async event => {

            if (!dragging) {
                return;
            }


            dragging = false;


            try {

                img.releasePointerCapture(
                    event.pointerId
                );

            } catch {}


            const rect =
                boardWrapper
                    .getBoundingClientRect();


            let x =
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width *
                100;


            let y =
                (
                    event.clientY -
                    rect.top
                ) /
                rect.height *
                100;


            x =
                Math.max(
                    0,
                    Math.min(
                        100,
                        x
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        100,
                        y
                    )
                );


            await update(

                ref(
                    db,
                    `rooms/${state.roomCode}/players/${state.playerId}`
                ),

                {

                    x,
                    y

                }

            );

        }
    );


    img.addEventListener(
        "pointercancel",
        () => {

            dragging = false;

        }
    );

}


/* =========================================================
   돈 선택
   ========================================================= */

const moneyValues = [
    1,
    2,
    5,
    10,
    50
];


const moneyCounts = {

    1: 0,
    2: 0,
    5: 0,
    10: 0,
    50: 0

};


/*
 * 돈 수량을 변경한다.
 */

window.changeMoneyCount =
function (
    value,
    amount
) {

    moneyCounts[value] =
        Math.max(
            0,
            moneyCounts[value] +
            amount
        );


    $(
        `moneyCount${value}`
    ).textContent =
        moneyCounts[value];


    updateSelectedMoney();

};


/*
 * 선택한 돈의 총액을 계산한다.
 */

function getSelectedMoney() {

    let total = 0;


    for (
        const value
        of moneyValues
    ) {

        total +=
            value *
            10000 *
            moneyCounts[value];

    }


    return total;

}


/*
 * 선택 금액을 표시한다.
 */

function updateSelectedMoney() {

    $("selectedMoney")
        .textContent =
        formatMoney(
            getSelectedMoney()
        );

}


/*
 * 돈 선택을 초기화한다.
 */

function resetMoneySelection() {

    for (
        const value
        of moneyValues
    ) {

        moneyCounts[value] =
            0;


        $(
            `moneyCount${value}`
        ).textContent =
            "0";

    }


    updateSelectedMoney();

}

                document.createElement(
                    "span"
                );


            balance.className =
                "balance-money";


            balance.textContent =
                formatMoney(
                    player.balance ??
                    2900000
                );


            div.append(
                name,
                balance
            );


            list.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   돈 받기
   ========================================================= */

window.receiveMoney =
async function () {

    const total =
        getSelectedMoney();


    if (
        total <= 0
    ) {
        return;
    }


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try {

        await runTransaction(
            playerRef,
            balance => {

                return (
                    Number(
                        balance ??
                        2900000
                    ) +
                    total
                );

            }
        );


        resetMoneySelection();

    } catch (error) {

        console.error(error);

    }

};


/* =========================================================
   돈 내기
   ========================================================= */

window.payMoney =
async function () {

    const total =
        getSelectedMoney();


    if (
        total <= 0
    ) {
        return;
    }


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try {

        const result =
            await runTransaction(
                playerRef,
                balance => {

                    const current =
                        Number(
                            balance ??
                            2900000
                        );


                    if (
                        current <
                        total
                    ) {

                        return;

                    }


                    return (
                        current -
                        total
                    );

                }
            );


        if (
            !result.committed
        ) {

            alert(
                "잔고가 부족하다."
            );

            return;

        }


        resetMoneySelection();

    } catch (error) {

        console.error(error);

    }

};


/* =========================================================
   사회복지기금 표시
   ========================================================= */

function renderWelfare() {

    $("welfareFund")
        .textContent =
        formatMoney(
            state.welfareFund
        );

}


/* =========================================================
   사회복지기금 내기
   ========================================================= */

window.payWelfareFund =
async function () {

    const amount =
        150000;


    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    try {

        const result =
            await runTransaction(
                roomRef,
                room => {

                    if (!room) {
                        return;
                    }


                    const players =
                        room.players ||
                        {};


                    const player =
                        players[
                            state.playerId
                        ];


                    if (!player) {
                        return;
                    }


                    const balance =
                        Number(
                            player.balance ??
                            2900000
                        );


                    if (
                        balance <
                        amount
                    ) {

                        return;

                    }


                    player.balance =
                        balance -
                        amount;


                    room.welfareFund =
                        Number(
                            room.welfareFund ||
                            0
                        ) +
                        amount;


                    return room;

                }
            );


        if (
            !result.committed
        ) {

            alert(
                "잔고가 부족하다."
            );

        }

    } catch (error) {

        console.error(error);

    }

};


/* =========================================================
   사회복지기금 받기
   ========================================================= */

window.receiveWelfareFund =
async function () {

    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    try {

        await runTransaction(
            roomRef,
            room => {

                if (!room) {
                    return;
                }


                const players =
                    room.players ||
                    {};


                const player =
                    players[
                        state.playerId
                    ];


                if (!player) {
                    return;
                }


                const fund =
                    Number(
                        room.welfareFund ||
                        0
                    );


                if (
                    fund <= 0
                ) {

                    return room;

                }


                player.balance =
                    Number(
                        player.balance ??
                        2900000
                    ) +
                    fund;


                room.welfareFund =
                    0;


                return room;

            }
        );

    } catch (error) {

        console.error(error);

    }

};
