<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대곽마블</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#151515;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.4;
}

/* =========================
   공통
========================= */

.hidden{
    display:none!important;
}

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.panel{
    width:min(520px,100%);
    background:#242424;
    border-radius:20px;
    padding:28px;
    box-shadow:0 12px 40px #0006;
}

h1,
h2{
    margin-top:0;
}

input{
    width:100%;
    padding:13px 15px;
    border:1px solid #555;
    border-radius:10px;
    background:#171717;
    color:#fff;
    outline:none;
    margin-bottom:10px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#fff;
    color:#111;
    font-weight:700;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
}

.status{
    color:#bbb;
    font-size:14px;
    margin:8px 0;
}

.error{
    color:#ff7d7d;
    white-space:pre-wrap;
}

/* =========================
   방 코드
========================= */

.room-code{
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
    text-align:center;
    padding:12px;
    background:#111;
    border-radius:12px;
    margin:12px 0 20px;
}

/* =========================
   플레이어
========================= */

#players{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:10px 0 20px;
}

.player{
    background:#181818;
    padding:10px 12px;
    border-radius:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-name{
    display:flex;
    align-items:center;
    gap:7px;
}

.host-mark{
    color:#ffd84d;
    font-size:12px;
}

/* =========================
   말 선택
========================= */

.pieces{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:10px;
    margin-top:10px;
}

.piece{
    min-height:100px;
    padding:8px;
    background:#171717;
    border:2px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    border-radius:10px;
}

.piece.selected{
    border-color:#fff;
}

.piece.used{
    opacity:.35;
}

.piece img{
    max-width:70px;
    max-height:70px;
}

.piece small{
    font-size:12px;
    color:#aaa;
}

/* =========================
   게임 화면
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
    padding:15px;
    justify-content:center;
    align-items:flex-start;
}

.board-wrap{
    position:relative;
    width:min(100%,1000px);
    z-index:1;
}

.board-wrap>img:first-child{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
}

/* =========================
   말
========================= */

.game-piece{
    position:absolute;
    width:6%;
    max-width:65px;
    min-width:30px;
    aspect-ratio:1;
    object-fit:contain;
    transform:translate(-50%,-50%);
    z-index:100;
    cursor:grab;
    user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
}

.game-piece:active{
    cursor:grabbing;
}

/* =========================
   주사위
========================= */

#diceArea{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:center;
    z-index:20;
    pointer-events:none;
}

.dice{
    width:110px;
    height:110px;
    object-fit:contain;
    opacity:.8;
    filter:drop-shadow(0 4px 8px #0008);
}

/* =========================
   턴 순서
========================= */

#turnOrder{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;
    background:#151515ee;
    border:1px solid #555;
    border-radius:12px;
    padding:10px 13px;
    min-width:150px;
    box-shadow:0 5px 20px #0008;
}

.turn-title{
    font-weight:800;
    margin-bottom:7px;
}

.turn-player{
    padding:4px 7px;
    border-radius:6px;
    color:#bbb;
    font-size:14px;
}

.turn-player.current{
    background:#fff;
    color:#111;
    font-weight:900;
}

/* =========================
   주사위 컨트롤
========================= */

#turnControls{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:1000;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;

    background:#151515ee;
    border:1px solid #555;
    border-radius:14px;
    padding:10px 14px;
    box-shadow:0 5px 20px #0008;
}

#turnStatus{
    font-size:14px;
    color:#ddd;
}

#rollDiceButton{
    min-width:160px;
    font-size:16px;
}

/* =========================
   금액 패널
========================= */

#moneyToggleButton{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    background:#fff;
    color:#111;
    padding:10px 15px;
    border-radius:10px;
    box-shadow:0 5px 20px #0008;
}

#moneyPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    width:min(360px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow-y:auto;

    background:#222;
    border:1px solid #555;
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 35px #000b;
}

.money-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.money-header h3{
    margin:0;
}

#moneyCloseButton{
    background:#444;
    color:#fff;
    padding:7px 10px;
}

.balance-box{
    background:#111;
    border-radius:12px;
    padding:12px;
    margin-bottom:15px;
}

.balance-label{
    color:#aaa;
    font-size:13px;
}

.balance-value{
    font-size:25px;
    font-weight:900;
    margin-top:3px;
}

.money-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.money-row{
    display:grid;
    grid-template-columns:65px 1fr 42px 42px;
    gap:7px;
    align-items:center;
    background:#181818;
    border-radius:9px;
    padding:7px;
}

.money-image{
    width:55px;
    height:38px;
    object-fit:contain;
}

.money-label{
    font-weight:800;
}

.money-count{
    text-align:center;
    font-weight:900;
}

.money-small-button{
    width:38px;
    height:38px;
    padding:0;
    background:#444;
    color:#fff;
}

.selected-money{
    background:#111;
    border-radius:10px;
    padding:11px;
    margin:14px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.selected-money-value{
    font-weight:900;
    color:#fff;
}

.money-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.money-buttons button{
    background:#fff;
    color:#111;
}

.welfare-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #444;
}

.welfare-title{
    font-weight:900;
    margin-bottom:8px;
}

.welfare-fund{
    background:#111;
    border-radius:9px;
    padding:10px;
    margin-bottom:8px;
}

.welfare-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.welfare-buttons button{
    background:#444;
    color:#fff;
}

/* =========================
   모바일
========================= */

@media(max-width:600px){

    #turnOrder{
        top:auto;
        bottom:80px;
        left:10px;
        min-width:125px;
        padding:8px;
    }

    #turnControls{
        bottom:10px;
    }

    #moneyToggleButton{
        top:10px;
        right:10px;
    }

    #moneyPanel{
        top:10px;
        right:10px;
        max-height:calc(100vh - 20px);
    }

    .dice{
        width:75px;
        height:75px;
    }

    #diceArea{
        gap:8px;
    }
}
</style>
</head>

<!-- =========================

</div>


<!-- =========================

========================= -->

<div id="turnOrder">

</div>


<!-- =========================

<div id="turnControls">

<button

<!-- =========================

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    onValue,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAgifEo4ulWFIoqYppZjs60xqVAXK-u31U",

    authDomain:
        "dshs-marble.firebaseapp.com",

    databaseURL:
        "https://dshs-marble-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dshs-marble",

    storageBucket:
        "dshs-marble.firebasestorage.app",

    messagingSenderId:
        "567950560406",

    appId:
        "1:567950560406:web:6470f6c91d8ad73e45c6b7"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =========================
   상태
========================= */

const state = {

    nickname: "",

    roomCode: "",

    playerId: "",

    hostId: null,

    selectedPiece: null,

    players: [],

    pieces: [],

    isHost: false,

    turnOrder: [],

    currentTurnIndex: 0,

    gameStarted: false,

    diceRolling: false,

    lastDiceRollId: null,

    welfareFund: 0,

    dragging: false

};


/* =========================
   금액 선택 상태
========================= */

const moneyCounts = {

    1: 0,
    2: 0,
    5: 0,
    10: 0,
    50: 0

};


/* =========================
   DOM
========================= */

const $ = id =>
    document.getElementById(id);


/* =========================
   인증
========================= */

async function ensureAuth(){

    if(auth.currentUser){

        state.playerId =
            auth.currentUser.uid;

        return;

    }

    const credential =
        await signInAnonymously(auth);

    state.playerId =
        credential.user.uid;
}


/* =========================
   방 코드
========================= */

function makeRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i=0;i<6;i++){

        code +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];

    }

    return code;
}


/* =========================
   닉네임
========================= */

function getNickname(){

    return $("nickname")
        .value
        .trim();

}


/* =========================
   금액 표시
========================= */

function formatMoney(value){

    const manwon =
        Number(value || 0) / 10000;

    return manwon.toLocaleString("ko-KR")
        + "만원";

}


/* =========================
   방 만들기
========================= */

async function createRoom(){

    const nickname =
        getNickname();

    if(!nickname){

        $("loginError").textContent =
            "닉네임을 입력해";

        return;

    }

    try{

        await ensureAuth();

        let code;
        let exists = true;

        for(let i=0;i<20 && exists;i++){

            code =
                makeRoomCode();

            const snapshot =
                await get(
                    ref(db,`rooms/${code}`)
                );

            exists =
                snapshot.exists();

        }

        if(exists){

            throw new Error(
                "방 코드 생성에 실패했어"
            );

        }

        state.roomCode =
            code;

        state.nickname =
            nickname;

        state.hostId =
            state.playerId;

        state.isHost =
            true;


        await set(
            ref(db,`rooms/${code}`),
            {

                hostId:
                    state.playerId,

                gameStarted:
                    false,

                createdAt:
                    Date.now(),

                dice1:
                    1,

                dice2:
                    1,

                diceRolling:
                    false,

                diceRollId:
                    null,

                currentTurnIndex:
                    0,

                turnOrder:
                    [],

                welfareFund:
                    0,

                players:{

                    [state.playerId]:{

                        playerId:
                            state.playerId,

                        nickname:
                            nickname,

                        piece:
                            null,

                        x:
                            null,

                        y:
                            null,

                        balance:
                            2900000,

                        joinedAt:
                            Date.now()

                    }

                }

            }
        );


        showRoom();

    }catch(error){

        console.error(error);

        $("loginError").textContent =
            "방을 만들 수 없어\n"
            + error.message;

    }

}


/* =========================
   방 입장
========================= */

async function joinRoom(){

    const nickname =
        getNickname();

    const code =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();


    if(!nickname){

        $("loginError").textContent =
            "닉네임을 입력해";

        return;

    }

    if(code.length !== 6){

        $("loginError").textContent =
            "방 코드는 6자리야";

        return;

    }


    try{

        await ensureAuth();

        const roomRef =
            ref(db,`rooms/${code}`);

        const snapshot =
            await get(roomRef);

        if(!snapshot.exists()){

            throw new Error(
                "존재하지 않는 방이야"
            );

        }


        const data =
            snapshot.val();


        if(data.gameStarted){

            throw new Error(
                "이미 게임이 시작됐어"
            );

        }


        const players =
            data.players || {};

        if(Object.keys(players).length >= 5){

            throw new Error(
                "방이 가득 찼어"
            );

        }


        state.roomCode =
            code;

        state.nickname =
            nickname;

        state.hostId =
            data.hostId || null;

        state.isHost =
            state.hostId ===
            state.playerId;


        await update(
            ref(
                db,
                `rooms/${code}/players/${state.playerId}`
            ),
            {

                playerId:
                    state.playerId,

                nickname:
                    nickname,

                piece:
                    null,

                x:
                    null,

                y:
                    null,

                balance:
                    2900000,

                joinedAt:
                    Date.now()

            }
        );


        showRoom();


    }catch(error){

        console.error(error);

        $("loginError").textContent =
            error.message;

    }

}


/* =========================
   대기실 표시
========================= */

function showRoom(){

    $("loginScreen")
        .classList
        .add("hidden");

    $("roomScreen")
        .classList
        .remove("hidden");

    $("roomCode")
        .textContent =
        state.roomCode;

    watchRoom();

    loadPieces();

}


/* =========================
   게임 화면
========================= */

function showGame(){

    $("roomScreen")
        .classList
        .add("hidden");

    $("loginScreen")
        .classList
        .add("hidden");

    $("gameScreen")
        .style
        .display =
        "flex";

    $("moneyToggleButton")
        .classList
        .remove("hidden");

    renderGamePieces();

}


/* =========================
   방 감시
========================= */

function watchRoom(){

    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    onValue(
        roomRef,
        snapshot => {

            if(!snapshot.exists()){

                alert("방이 삭제됐어");

                location.reload();

                return;

            }


            const data =
                snapshot.val();


            state.hostId =
                data.hostId || null;

            state.isHost =
                state.hostId ===
                state.playerId;


            state.players =
                Object.values(
                    data.players || {}
                );


            state.turnOrder =
                data.turnOrder || [];


            state.currentTurnIndex =
                data.currentTurnIndex || 0;


            state.gameStarted =
                !!data.gameStarted;


            state.diceRolling =
                !!data.diceRolling;


            state.welfareFund =
                data.welfareFund || 0;


            $("welfareFund")
                .textContent =
                formatMoney(
                    state.welfareFund
                );


            renderPlayers();

            renderTurnOrder();

            renderTurnControls();

            updateMyBalance();

            renderGamePieces();


            if(state.gameStarted){

                showGame();

            }


            const dice1 =
                data.dice1 || 1;

            const dice2 =
                data.dice2 || 1;


            $("dice1").src =
                `dice/dice${dice1}.png`;

            $("dice2").src =
                `dice/dice${dice2}.png`;


            const rollId =
                data.diceRollId;


            if(
                rollId &&
                rollId !== state.lastDiceRollId
            ){

                state.lastDiceRollId =
                    rollId;

                animateDice(
                    dice1,
                    dice2
                );

            }

        }
    );

}


/* =========================
   플레이어 표시
========================= */

function renderPlayers(){

    const container =
        $("players");

    container.innerHTML = "";


    for(const player of state.players){

        const div =
            document.createElement("div");

        div.className =
            "player";


        const left =
            document.createElement("div");

        left.className =
            "player-name";


        const name =
            document.createElement("span");

        name.textContent =
            player.nickname || "이름 없음";


        left.appendChild(name);


        if(
            player.playerId ===
            state.hostId
        ){

            const host =
                document.createElement("span");

            host.className =
                "host-mark";

            host.textContent =
                "방장";

            left.appendChild(host);

        }


        const balance =
            document.createElement("span");

        balance.style.color =
            "#aaa";

        balance.textContent =
            formatMoney(
                player.balance || 0
            );


        div.appendChild(left);

        div.appendChild(balance);

        container.appendChild(div);

    }


    $("startBtn").disabled =
        !state.isHost ||
        state.players.length < 1;

}


/* =========================
   말 목록
========================= */

async function loadPieces(){

    const container =
        $("pieces");

    container.innerHTML = "";

    state.pieces = [];


    for(let i=1;i<=100;i++){

        const img =
            new Image();

        img.src =
            `P/P${i}.png`;


        try{

            await img.decode();

            state.pieces.push(i);

        }catch{

            break;

        }

    }


    renderPieceSelection();

}


/* =========================
   말 선택 표시
========================= */

function renderPieceSelection(){

    const container =
        $("pieces");

    container.innerHTML = "";


    const usedPieces =
        state.players
            .map(p => p.piece)
            .filter(Boolean);


    for(const piece of state.pieces){

        const div =
            document.createElement("div");

        div.className =
            "piece";


        if(
            state.selectedPiece ===
            piece
        ){

            div.classList.add(
                "selected"
            );

        }


        if(
            usedPieces.includes(piece) &&
            state.selectedPiece !== piece
        ){

            div.classList.add(
                "used"
            );

        }


        const img =
            document.createElement("img");

        img.src =
            `P/P${piece}.png`;


        const small =
            document.createElement("small");

        small.textContent =
            `P${piece}`;


        div.appendChild(img);

        div.appendChild(small);


        if(
            !usedPieces.includes(piece) ||
            state.selectedPiece === piece
        ){

            div.onclick =
                () => selectPiece(piece);

        }


        container.appendChild(div);

    }

}


/* =========================
   말 선택
========================= */

async function selectPiece(piece){

    const usedByOther =
        state.players.some(
            p =>
                p.playerId !==
                state.playerId &&
                p.piece === piece
        );


    if(usedByOther){

        return;

    }


    state.selectedPiece =
        piece;


    await update(

        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}`
        ),

        {
            piece:
                piece
        }

    );


    renderPieceSelection();

}


/* =========================
   게임 시작
========================= */

async function startGame(){

    if(!state.isHost){

        return;

    }


    if(
        state.players.length < 1
    ){

        return;

    }


    const order =
        state.players
            .map(p => p.playerId)
            .sort(
                () =>
                    Math.random() - 0.5
            );


    await update(

        ref(
            db,
            `rooms/${state.roomCode}`
        ),

        {

            gameStarted:
                true,

            turnOrder:
                order,

            currentTurnIndex:
                0,

            dice1:
                1,

            dice2:
                1,

            diceRolling:
                false,

            diceRollId:
                null,

            welfareFund:
                0

        }

    );

}


/* =========================
   턴 순서
========================= */

function renderTurnOrder(){

    const container =
        $("turnList");

    container.innerHTML = "";


    state.turnOrder.forEach(
        (playerId,index) => {

            const player =
                state.players.find(
                    p =>
                        p.playerId ===
                        playerId
                );


            if(!player){

                return;

            }


            const div =
                document.createElement("div");

            div.className =
                "turn-player";


            if(
                index ===
                state.currentTurnIndex
            ){

                div.classList.add(
                    "current"
                );

            }


            div.textContent =
                `${index + 1}. ${player.nickname}`;


            container.appendChild(div);

        }
    );

}


/* =========================
   턴 컨트롤
========================= */

function renderTurnControls(){

    if(!state.gameStarted){

        $("turnStatus")
            .textContent =
            "게임을 시작해";

        $("rollDiceButton")
            .disabled =
            true;

        return;

    }


    const currentPlayerId =
        state.turnOrder[
            state.currentTurnIndex
        ];


    const currentPlayer =
        state.players.find(
            p =>
                p.playerId ===
                currentPlayerId
        );


    const isMyTurn =
        currentPlayerId ===
        state.playerId;


    if(currentPlayer){

        $("turnStatus")
            .textContent =
            isMyTurn
                ? "✨ 네 턴이야"
                : `${currentPlayer.nickname}의 턴`;

    }


    $("rollDiceButton")
        .disabled =
        !isMyTurn ||
        state.diceRolling;

}


/* =========================
   주사위
   중요: window에 등록
========================= */

window.rollDice =
async function(){

    if(state.diceRolling){

        return;

    }


    const currentPlayerId =
        state.turnOrder[
            state.currentTurnIndex
        ];


    if(
        currentPlayerId !==
        state.playerId
    ){

        return;

    }


    const final1 =
        randomDiceValue();

    const final2 =
        randomDiceValue();


    state.diceRolling =
        true;


    renderTurnControls();


    try{

        await update(

            ref(
                db,
                `rooms/${state.roomCode}`
            ),

            {

                dice1:
                    final1,

                dice2:
                    final2,

                diceRolling:
                    true,

                diceRollId:
                    Date.now()

            }

        );


        /*
          잠깐 주사위가 굴러가는 것처럼
          보인 뒤 다음 턴으로 넘긴다.
        */

        setTimeout(
            async () => {

                try{

                    const snapshot =
                        await get(
                            ref(
                                db,
                                `rooms/${state.roomCode}`
                            )
                        );


                    if(
                        !snapshot.exists()
                    ){

                        return;

                    }


                    const room =
                        snapshot.val();


                    const nextIndex =
                        (
                            (room.currentTurnIndex || 0)
                            + 1
                        )
                        %
                        room.turnOrder.length;


                    await update(

                        ref(
                            db,
                            `rooms/${state.roomCode}`
                        ),

                        {

                            diceRolling:
                                false,

                            currentTurnIndex:
                                nextIndex

                        }

                    );


                }catch(error){

                    console.error(error);

                    await update(

                        ref(
                            db,
                            `rooms/${state.roomCode}`
                        ),

                        {
                            diceRolling:
                                false
                        }

                    );

                }

            },
            1200
        );


    }catch(error){

        console.error(error);

        state.diceRolling =
            false;

        renderTurnControls();

    }

};


/* =========================
   주사위 랜덤
========================= */

function randomDiceValue(){

    return Math.floor(
        Math.random() * 6
    ) + 1;

}


/* =========================
   주사위 애니메이션
========================= */

function animateDice(
    final1,
    final2
){

    const dice1 =
        $("dice1");

    const dice2 =
        $("dice2");


    let count = 0;

    const timer =
        setInterval(
            () => {

                dice1.src =
                    `dice/dice${randomDiceValue()}.png`;

                dice2.src =
                    `dice/dice${randomDiceValue()}.png`;


                count++;


                if(count >= 8){

                    clearInterval(timer);

                    dice1.src =
                        `dice/dice${final1}.png`;

                    dice2.src =
                        `dice/dice${final2}.png`;

                }

            },
            100
        );

}


/* =========================
   게임 말 표시
========================= */

function renderGamePieces(){

    const container =
        $("gamePieces");

    container.innerHTML = "";


    for(const player of state.players){

        if(!player.piece){

            continue;

        }


        const img =
            document.createElement("img");

        img.className =
            "game-piece";

        img.src =
            `P/P${player.piece}.png`;

        img.alt =
            player.nickname;


        /*
          위치가 없으면 중앙 근처에 둔다.
        */

        const x =
            player.x ?? 50;

        const y =
            player.y ?? 50;


        img.style.left =
            `${x}%`;

        img.style.top =
            `${y}%`;


        if(
            player.playerId ===
            state.playerId
        ){

            enablePieceDrag(
                img,
                player
            );

        }else{

            img.style.cursor =
                "default";

        }


        container.appendChild(img);

    }

}


/* =========================
   말 드래그
========================= */

function enablePieceDrag(
    img,
    player
){

    let dragging = false;


    const getPosition =
        event => {

            const board =
                document.querySelector(
                    ".board-wrap"
                );


            const rect =
                board.getBoundingClientRect();


            const clientX =
                event.clientX;

            const clientY =
                event.clientY;


            let x =
                (
                    (clientX - rect.left)
                    / rect.width
                ) * 100;


            let y =
                (
                    (clientY - rect.top)
                    / rect.height
                ) * 100;


            x =
                Math.max(
                    0,
                    Math.min(100,x)
                );

            y =
                Math.max(
                    0,
                    Math.min(100,y)
                );


            return {x,y};

        };


    img.addEventListener(
        "pointerdown",
        event => {

            dragging = true;

            img.setPointerCapture(
                event.pointerId
            );

            state.dragging =
                true;

            event.preventDefault();

        }
    );


    img.addEventListener(
        "pointermove",
        event => {

            if(!dragging){

                return;

            }


            const {x,y} =
                getPosition(event);


            img.style.left =
                `${x}%`;

            img.style.top =
                `${y}%`;

        }
    );


    img.addEventListener(
        "pointerup",
        async event => {

            if(!dragging){

                return;

            }


            dragging = false;

            state.dragging =
                false;


            const {x,y} =
                getPosition(event);


            img.style.left =
                `${x}%`;

            img.style.top =
                `${y}%`;


            try{

                await update(

                    ref(
                        db,
                        `rooms/${state.roomCode}/players/${state.playerId}`
                    ),

                    {

                        x:
                            x,

                        y:
                            y

                    }

                );

            }catch(error){

                console.error(error);

            }

        }
    );

}


/* =========================
   내 잔액
========================= */

function updateMyBalance(){

    const me =
        state.players.find(
            p =>
                p.playerId ===
                state.playerId
        );


    $("myBalance")
        .textContent =
        formatMoney(
            me?.balance || 0
        );

}


/* =========================
   금액 패널
========================= */

window.toggleMoneyPanel =
function(){

    const panel =
        $("moneyPanel");

    const button =
        $("moneyToggleButton");


    const isHidden =
        panel.classList.contains(
            "hidden"
        );


    if(isHidden){

        panel.classList.remove(
            "hidden"
        );

        button.classList.add(
            "hidden"
        );

    }else{

        panel.classList.add(
            "hidden"
        );

        button.classList.remove(
            "hidden"
        );

    }

};


/* =========================
   금액 개수 변경
========================= */

window.changeMoneyCount =
function(value,change){

    moneyCounts[value] =
        Math.max(
            0,
            moneyCounts[value] + change
        );


    updateSelectedMoney();

};


/* =========================
   선택 금액 계산
========================= */

function getSelectedMoney(){

    return (

        moneyCounts[1] * 10000 +
        moneyCounts[2] * 20000 +
        moneyCounts[5] * 50000 +
        moneyCounts[10] * 100000 +
        moneyCounts[50] * 500000

    );

}


/* =========================
   선택 금액 표시
========================= */

function updateSelectedMoney(){

    $("selectedMoney")
        .textContent =
        formatMoney(
            getSelectedMoney()
        );

}


/* =========================
   금액 선택 초기화
========================= */

function resetMoneyCounts(){

    moneyCounts[1] =
        0;

    moneyCounts[2] =
        0;

    moneyCounts[5] =
        0;

    moneyCounts[10] =
        0;

    moneyCounts[50] =
        0;


    updateSelectedMoney();

}


/* =========================
   돈 받기
========================= */

window.receiveMoney =
async function(){

    const amount =
        getSelectedMoney();


    if(amount <= 0){

        return;

    }


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try{

        await runTransaction(
            playerRef,
            balance =>
                (balance || 0) + amount
        );


        resetMoneyCounts();

    }catch(error){

        console.error(error);

    }

};


/* =========================
   돈 내기
========================= */

window.payMoney =
async function(){

    const amount =
        getSelectedMoney();


    if(amount <= 0){

        return;

    }


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try{

        const result =
            await runTransaction(
                playerRef,
                balance => {

                    balance =
                        balance || 0;


                    if(
                        balance < amount
                    ){

                        return;

                    }


                    return balance - amount;

                }
            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );

            return;

        }


        resetMoneyCounts();


    }catch(error){

        console.error(error);

    }

};


/* =========================
   사회복지기금 내기
========================= */

window.payWelfareFund =
async function(){

    const amount =
        150000;


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try{

        const result =
            await runTransaction(
                playerRef,
                balance => {

                    balance =
                        balance || 0;


                    if(
                        balance < amount
                    ){

                        return;

                    }


                    return balance - amount;

                }
            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );

            return;

        }


        await runTransaction(

            ref(
                db,
                `rooms/${state.roomCode}/welfareFund`
            ),

            fund =>
                (fund || 0) + amount

        );


    }catch(error){

        console.error(error);

    }

};


/* =========================
   사회복지기금 받기
========================= */

window.receiveWelfareFund =
async function(){

    const fundRef =
        ref(
            db,
            `rooms/${state.roomCode}/welfareFund`
        );


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}/balance`
        );


    try{

        const result =
            await runTransaction(
                fundRef,
                fund => {

                    fund =
                        fund || 0;


                    if(fund <= 0){

                        return;

                    }


                    return 0;

                }
            );


        if(!result.committed){

            return;

        }


        const amount =
            result.snapshot.val();


        await runTransaction(
            playerRef,
            balance =>
                (balance || 0) + amount
        );


    }catch(error){

        console.error(error);

    }

};

   버튼 이벤트
========================= */

$("createBtn")
    .addEventListener(
        "click",
        createRoom
    );


$("showJoinBtn")
    .addEventListener(
        "click",
        () => {

            $("joinBox")
                .classList
                .toggle("hidden");

        }
    );


$("joinBtn")
    .addEventListener(
        "click",
        joinRoom
    );


$("startBtn")
    .addEventListener(
        "click",

    );


$("roomInput")
    .addEventListener(

========================= */

onAuthStateChanged(
    auth,
    user => {

        if(user){

        }

    }
);
