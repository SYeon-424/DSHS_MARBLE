<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>대곽마블</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
    }

    button,
    input {
        font: inherit;
    }

    .screen {
        display: none;
        min-height: 100vh;
        padding: 30px 20px;
    }

    .screen.active {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-size: 42px;
        margin: 30px 0;
    }

    h2 {
        margin-top: 0;
    }

    input {
        width: min(400px, 90vw);
        padding: 14px;
        border: 2px solid #555;
        border-radius: 10px;
        background: #222;
        color: white;
        outline: none;
        margin-bottom: 12px;
    }

    input:focus {
        border-color: #aaa;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 13px 20px;
        margin: 5px;
        cursor: pointer;
        background: #444;
        color: white;
        transition: 0.15s;
    }

    button:hover {
        background: #666;
    }

    button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    .primary {
        background: #7b42ff;
        font-weight: bold;
    }

    .primary:hover {
        background: #9465ff;
    }

    .panel {
        width: min(600px, 95vw);
        background: #1d1d1d;
        border: 1px solid #444;
        border-radius: 16px;
        padding: 20px;
        margin: 10px;
    }

    .room-code {
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 6px;
        text-align: center;
        padding: 15px;
        background: #111;
        border-radius: 10px;
        margin: 15px 0;
    }

    #playerList {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 40px;
    }

    .player {
        background: #333;
        border-radius: 20px;
        padding: 8px 14px;
    }

    .pieces {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin-top: 15px;
    }

    .piece-button {
        position: relative;
        min-height: 130px;
        background: #292929;
        border: 2px solid #444;
        border-radius: 12px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .piece-button:hover {
        border-color: white;
        background: #333;
    }

    .piece-button.selected {
        border-color: #7b42ff;
        box-shadow: 0 0 0 2px #7b42ff inset;
    }

    .piece-button.used {
        opacity: 0.35;
    }

    .piece-button img {
        width: 80px;
        height: 80px;
        object-fit: contain;
    }

    .piece-name {
        margin-top: 5px;
        font-weight: bold;
    }

    .used-label {
        position: absolute;
        top: 6px;
        right: 6px;
        background: #e33;
        color: white;
        font-size: 11px;
        padding: 3px 6px;
        border-radius: 6px;
    }

    #gameScreen {
        padding: 10px;
    }

    #boardWrapper {
        position: relative;
        width: min(95vw, 900px);
        margin: auto;
    }

    #board {
        display: block;
        width: 100%;
        height: auto;
    }

    .message {
        color: #aaa;
        text-align: center;
        margin: 10px;
    }

    .error {
        color: #ff6b6b;
        min-height: 24px;
    }

    .success {
        color: #7cff9b;
    }
</style>
</head>

<body>

<!-- 시작 화면 -->

<section id="startScreen" class="screen active">

    <h1>대곽마블</h1>

    <div class="panel">

        <h2>닉네임</h2>

        <input
            id="nicknameInput"
            type="text"
            maxlength="12"
            placeholder="닉네임"
        >

        <button id="createRoomButton" class="primary">
            방 만들기
        </button>

        <hr style="border-color:#333; margin:20px 0;">

        <h2>방 들어가기</h2>

        <input
            id="roomCodeInput"
            type="text"
            maxlength="6"
            placeholder="방 코드"
        >

        <button id="joinRoomButton">
            들어가기
        </button>

        <div id="startMessage" class="error"></div>

    </div>

</section>


<!-- 대기실 -->

<section id="roomScreen" class="screen">

    <h1>대곽마블</h1>

    <div class="panel">

        <h2>방 코드</h2>

        <div id="roomCodeDisplay" class="room-code">
            ------
        </div>

        <div class="message">
            방 코드를 공유해 참가자를 초대
        </div>

    </div>


    <div class="panel">

        <h2>참가자</h2>

        <div id="playerList"></div>

    </div>


    <div class="panel">

        <h2>말 선택</h2>

        <div class="message">
            원하는 말을 하나 선택
            <br>
            다른 참가자가 선택한 말은 사용할 수 없음
        </div>

        <div id="pieceList" class="pieces">
            불러오는 중...
        </div>

        <div id="pieceMessage" class="message"></div>

    </div>


    <button id="startGameButton" class="primary" disabled>
        게임 시작
    </button>

    <div id="roomMessage" class="error"></div>

</section>


<!-- 게임 화면 -->

<section id="gameScreen" class="screen">

    <div id="boardWrapper">

        <img
            id="board"
            src="board.png"
            alt="대곽마블 게임판"
        >

    </div>

</section>


<!-- Firebase SDK -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    update,
    remove,
    onValue,
    onDisconnect
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================================================
   Firebase 설정
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAgifEo4ulWFIoqYppZjs60xqVAXK-u31U",

    authDomain:
        "dshs-marble.firebaseapp.com",

    databaseURL:
        "https://dshs-marble-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dshs-marble",

    storageBucket:
        "dshs-marble.firebasestorage.app",

    messagingSenderId:
        "567950560406",

    appId:
        "1:567950560406:web:6470f6c91d8ad73e45c6b7"

};


/* =========================================================
   Firebase 초기화
========================================================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================================================
   기본 상태
========================================================= */

const state = {

    nickname: "",

    roomCode: "",

    playerId: "",

    selectedPiece: null,

    players: [],

    pieces: [],

    isHost: false

};


/* =========================================================
   화면 전환
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");

}


/* =========================================================
   참가자 ID 생성
========================================================= */

function generatePlayerId() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


/* =========================================================
   랜덤 방 코드
========================================================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (let i = 0; i < 6; i++) {

        code +=
            chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];

    }

    return code;

}


/* =========================================================
   방 코드 생성
========================================================= */

async function createUniqueRoomCode() {

    for (let i = 0; i < 20; i++) {

        const code = generateRoomCode();

        const snapshot =
            await get(
                ref(db, `rooms/${code}`)
            );

        if (!snapshot.exists()) {

            return code;

        }

    }

    throw new Error(
        "사용 가능한 방 코드를 생성하지 못했어."
    );

}


/* =========================================================
   이미지 존재 여부 검사
========================================================= */

function imageExists(src) {

    return new Promise(resolve => {

        const img = new Image();

        img.onload = () => resolve(true);

        img.onerror = () => resolve(false);

        img.src = src;

    });

}


/* =========================================================
   P 폴더의 P1.png, P2.png...
   파일을 자동 탐색
========================================================= */

async function loadPieces() {

    const foundPieces = [];

    for (let i = 1; i <= 100; i++) {

        const src = `P/P${i}.png`;

        const exists =
            await imageExists(src);

        if (exists) {

            foundPieces.push({

                id: `P${i}`,

                src: src

            });

        }

    }

    state.pieces = foundPieces;

    renderPieces();

}


/* =========================================================
   말 선택 UI
========================================================= */

function renderPieces() {

    const container =
        document.getElementById("pieceList");

    container.innerHTML = "";

    if (state.pieces.length === 0) {

        container.innerHTML =
            `<div class="message">
                P 폴더에서 말을 찾지 못함
            </div>`;

        return;

    }


    state.pieces.forEach(piece => {

        const owner =
            state.players.find(
                player =>
                    player.piece === piece.id
            );


        const button =
            document.createElement("button");

        button.className =
            "piece-button";


        if (owner &&
            owner.playerId !== state.playerId) {

            button.classList.add("used");

            button.disabled = true;

        }


        if (
            state.selectedPiece === piece.id
        ) {

            button.classList.add("selected");

        }


        const img =
            document.createElement("img");

        img.src = piece.src;

        img.alt = piece.id;


        const name =
            document.createElement("div");

        name.className =
            "piece-name";

        name.textContent =
            piece.id;


        button.appendChild(img);

        button.appendChild(name);


        if (owner) {

            const label =
                document.createElement("div");

            label.className =
                "used-label";

            label.textContent =
                owner.playerId === state.playerId
                    ? "선택됨"
                    : "사용 중";

            button.appendChild(label);

        }


        button.addEventListener(
            "click",
            () => selectPiece(piece.id)
        );


        container.appendChild(button);

    });

}


/* =========================================================
   참가자 목록 UI
========================================================= */

function renderPlayers() {

    const container =
        document.getElementById("playerList");

    container.innerHTML = "";


    state.players.forEach(player => {

        const div =
            document.createElement("div");

        div.className = "player";


        let text =
            player.nickname;


        if (player.piece) {

            text +=
                ` · ${player.piece}`;

        } else {

            text +=
                " · 말 선택 중";

        }


        if (
            player.playerId === state.players[0]?.playerId
        ) {

            text += " · 방장";

        }


        div.textContent = text;

        container.appendChild(div);

    });

}


/* =========================================================
   게임 시작 버튼 상태
========================================================= */

function updateStartButton() {

    const button =
        document.getElementById(
            "startGameButton"
        );


    const everyoneSelected =
        state.players.length > 0 &&
        state.players.every(
            player => player.piece !== null
        );


    button.disabled =
        !state.isHost ||
        !everyoneSelected;

}


/* =========================================================
   Firebase 방 상태 감시
========================================================= */

function watchRoom() {

    const roomRef =
        ref(db, `rooms/${state.roomCode}`);


    onValue(roomRef, snapshot => {

        if (!snapshot.exists()) {

            document.getElementById(
                "roomMessage"
            ).textContent =
                "방이 존재하지 않음";

            return;

        }


        const data =
            snapshot.val();


        const playersObject =
            data.players || {};


        state.players =
            Object.values(playersObject);


        state.players.sort(
            (a, b) =>
                (a.joinedAt || 0) -
                (b.joinedAt || 0)
        );


        const me =
            state.players.find(
                player =>
                    player.playerId ===
                    state.playerId
            );


        if (me) {

            state.selectedPiece =
                me.piece || null;

        }


        state.isHost =
            state.players.length > 0 &&
            state.players[0].playerId ===
                state.playerId;


        renderPlayers();

        renderPieces();

        updateStartButton();


        if (data.gameStarted === true) {

            showScreen("gameScreen");

        }

    });

}


/* =========================================================
   방 생성
========================================================= */

async function createRoom() {

    const nickname =
        document
            .getElementById("nicknameInput")
            .value
            .trim();


    if (!nickname) {

        document.getElementById(
            "startMessage"
        ).textContent =
            "닉네임을 입력";

        return;

    }


    try {

        const roomCode =
            await createUniqueRoomCode();


        state.nickname =
            nickname;

        state.roomCode =
            roomCode;

        state.playerId =
            generatePlayerId();


        const player = {

            playerId:
                state.playerId,

            nickname:
                state.nickname,

            piece:
                null,

            joinedAt:
                Date.now()

        };


        await set(
            ref(
                db,
                `rooms/${roomCode}`
            ),
            {

                hostId:
                    state.playerId,

                gameStarted:
                    false,

                createdAt:
                    Date.now(),

                players: {

                    [state.playerId]:
                        player

                }

            }
        );


        setupDisconnect();

        document.getElementById(
            "roomCodeDisplay"
        ).textContent =
            roomCode;


        showScreen("roomScreen");

        loadPieces();

        watchRoom();


    } catch (error) {

        console.error(error);

        document.getElementById(
            "startMessage"
        ).textContent =
            "방 생성에 실패함";

    }

}


/* =========================================================
   방 참가
========================================================= */

async function joinRoom() {

    const nickname =
        document
            .getElementById("nicknameInput")
            .value
            .trim();


    const roomCode =
        document
            .getElementById("roomCodeInput")
            .value
            .trim()
            .toUpperCase();


    if (!nickname) {

        document.getElementById(
            "startMessage"
        ).textContent =
            "닉네임을 입력";

        return;

    }


    if (roomCode.length !== 6) {

        document.getElementById(
            "startMessage"
        ).textContent =
            "방 코드는 6자리";

        return;

    }


    try {

        const roomRef =
            ref(db, `rooms/${roomCode}`);


        const snapshot =
            await get(roomRef);


        if (!snapshot.exists()) {

            document.getElementById(
                "startMessage"
            ).textContent =
                "존재하지 않는 방";

            return;

        }


        const room =
            snapshot.val();


        if (room.gameStarted) {

            document.getElementById(
                "startMessage"
            ).textContent =
                "이미 게임이 시작된 방";

            return;

        }


        state.nickname =
            nickname;

        state.roomCode =
            roomCode;

        state.playerId =
            generatePlayerId();


        const player = {

            playerId:
                state.playerId,

            nickname:
                state.nickname,

            piece:
                null,

            joinedAt:
                Date.now()

        };


        await set(

            ref(
                db,
                `rooms/${roomCode}/players/${state.playerId}`
            ),

            player

        );


        setupDisconnect();


        document.getElementById(
            "roomCodeDisplay"
        ).textContent =
            roomCode;


        showScreen("roomScreen");

        loadPieces();

        watchRoom();


    } catch (error) {

        console.error(error);

        document.getElementById(
            "startMessage"
        ).textContent =
            "방 참가에 실패함";

    }

}


/* =========================================================
   접속 종료 시 참가자 제거
========================================================= */

function setupDisconnect() {

    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}`
        );


    onDisconnect(playerRef).remove();

}


/* =========================================================
   말 선택
========================================================= */

async function selectPiece(pieceId) {

    const player =
        state.players.find(
            player =>
                player.playerId ===
                state.playerId
        );


    if (!player) {
        return;
    }


    const alreadyUsed =
        state.players.find(
            player =>
                player.piece === pieceId &&
                player.playerId !==
                    state.playerId
        );


    if (alreadyUsed) {

        document.getElementById(
            "pieceMessage"
        ).textContent =
            "이미 선택된 말";

        document.getElementById(
            "pieceMessage"
        ).className =
            "message error";

        return;

    }


    const playerRef =
        ref(
            db,
            `rooms/${state.roomCode}/players/${state.playerId}`
        );


    try {

        await update(
            playerRef,
            {
                piece: pieceId
            }
        );


        document.getElementById(
            "pieceMessage"
        ).textContent =
            `${pieceId} 선택`;

        document.getElementById(
            "pieceMessage"
        ).className =
            "message success";


    } catch (error) {

        console.error(error);

        document.getElementById(
            "pieceMessage"
        ).textContent =
            "말 선택에 실패함";

    }

}


/* =========================================================
   게임 시작
========================================================= */

async function startGame() {

    if (!state.isHost) {
        return;
    }


    const everyoneSelected =
        state.players.length > 0 &&
        state.players.every(
            player => player.piece !== null
        );


    if (!everyoneSelected) {

        document.getElementById(
            "roomMessage"
        ).textContent =
            "모든 참가자가 말을 선택해야 함";

        return;

    }


    try {

        await update(
            ref(
                db,
                `rooms/${state.roomCode}`
            ),
            {
                gameStarted:
                    true
            }
        );

    } catch (error) {

        console.error(error);

        document.getElementById(
            "roomMessage"
        ).textContent =
            "게임 시작에 실패함";

    }

}


/* =========================================================
   이벤트 연결
========================================================= */

document
    .getElementById("createRoomButton")
    .addEventListener(
        "click",
        createRoom
    );


document
    .getElementById("joinRoomButton")
    .addEventListener(
        "click",
        joinRoom
    );


document
    .getElementById("startGameButton")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   방 코드 입력 자동 대문자 변환
========================================================= */

document
    .getElementById("roomCodeInput")
    .addEventListener(
        "input",
        event => {

            event.target.value =
                event.target.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9]/g,
                        ""
                    );

        }
    );


/* =========================================================
   페이지 종료 처리
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            state.roomCode &&
            state.playerId
        ) {

            remove(
                ref(
                    db,
                    `rooms/${state.roomCode}/players/${state.playerId}`
                )
            );

        }

    }
);


/* =========================================================
   초기 말 목록 로딩
========================================================= */

loadPieces();

</script>

</body>
</html>
