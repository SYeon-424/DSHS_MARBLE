<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대곽마블</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#151515;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}


/* =========================
   로그인 / 대기실
========================= */

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.panel{
    width:min(560px,100%);
    background:#242424;
    border-radius:20px;
    padding:28px;
    box-shadow:0 12px 40px #0006;
}

h1,
h2{
    margin-top:0;
}

input{
    width:100%;
    padding:13px 15px;
    border:1px solid #555;
    border-radius:10px;
    background:#171717;
    color:#fff;
    outline:none;
    margin-bottom:10px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#fff;
    color:#111;
    font-weight:700;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
}

.room-code{
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
    text-align:center;
    padding:12px;
    background:#111;
    border-radius:12px;
    margin:12px 0 20px;
}

.status{
    color:#bbb;
    font-size:14px;
    margin:8px 0;
}

.error{
    color:#ff7d7d;
    white-space:pre-wrap;
}


/* =========================
   참가자
========================= */

#players{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:10px 0 20px;
}

.player{
    background:#181818;
    padding:10px 12px;
    border-radius:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.player-me{
    font-weight:900;
}

.host-badge{
    font-size:11px;
    background:#fff;
    color:#111;
    padding:3px 6px;
    border-radius:5px;
}

.player-piece{
    color:#aaa;
    font-size:12px;
}


/* =========================
   말 선택
========================= */

.pieces{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:10px;
}

.piece{
    min-height:105px;
    padding:8px;
    background:#171717;
    border:2px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    border-radius:10px;
    user-select:none;
    cursor:pointer;
}

.piece.selected{
    border-color:#fff;
    background:#303030;
}

.piece.used{
    opacity:.35;
    cursor:not-allowed;
}

.piece img{
    width:65px;
    height:65px;
    object-fit:contain;
}

.piece small{
    font-size:12px;
    color:#aaa;
}


/* =========================
   게임 화면
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
    padding:25px 15px 40px;
    justify-content:center;
    align-items:flex-start;
}

.game-layout{
    width:min(100%,1000px);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
}

.board-wrap{
    position:relative;
    width:min(100%,1000px);
    z-index:1;
}

.board-image{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
}

/* =========================
   교무실 / 선생님 매수
========================= */
#staffRoomToggleButton{
    position:fixed;
    right:15px;
    top:116px;
    z-index:1100;
    background:#6b8cff;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    box-shadow:0 5px 20px #0008;
    font-weight:900;
}
#staffRoomPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1110;
    width:min(520px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow-y:auto;
    background:#222;
    border:1px solid #777;
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 35px #000b;
}
.staff-room-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
.staff-room-header h3{margin:0;}
.staff-board-toggle{width:100%;margin:0 0 10px;background:#3b3b3b;color:#fff;font-weight:900;}
.staff-board-section{padding-top:4px;}
.staff-room-layout{display:flex;flex-wrap:wrap;gap:8px;}
.staff-name-button{background:#3d4d72;color:#fff;border:2px solid #7188c9;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;transition:opacity .15s,filter .15s;}
.staff-name-button:hover{filter:brightness(1.15);}
.staff-name-button.owned{opacity:.38;filter:grayscale(.65);}
.staff-owned-divider{border:0;border-top:3px solid #777;margin:18px 0 12px;}
.staff-owned-title{font-weight:1000;margin-bottom:10px;}
.staff-owned-list{display:flex;flex-direction:column;gap:8px;}
.staff-owned-item{background:#171717;border:1px solid #555;border-radius:10px;padding:10px 12px;}
.staff-owned-name{font-weight:1000;}
.staff-owned-meta{color:#bbb;font-size:13px;margin-top:3px;}
.staff-room-status{color:#aaa;font-size:13px;margin:8px 0;}
.staff-detail-card{background:#111;border-radius:12px;padding:16px;margin-top:14px;color:#fff;}
.staff-detail-line{height:5px;border-radius:999px;margin:0 0 13px;background:var(--staff-color,#7188c9);}
.staff-detail-name{font-size:22px;font-weight:1000;text-align:center;margin-bottom:12px;}
.staff-detail-divider{border:0;border-top:2px dashed #777;margin:12px 0;}
.staff-detail-row{line-height:1.7;font-size:14px;}
.staff-buy-button{width:100%;margin-top:14px;background:#d9a441;color:#241600;font-weight:1000;}
.staff-buy-owned{background:#111;color:#fff;border:1px solid #777;}

/* =========================
   황금열쇠 버튼 / 카드
========================= */

#goldenKeyButton{
    position:absolute;
    left:25.5%;
    top:71%;
    transform:translate(-50%,-50%);
    z-index:60;
    width:43px;
    min-height:24px;
    padding:4px 5px;
    border:2px solid #f4c400;
    border-radius:8px;
    background:#ffd92e;
    color:#3b2a00;
    font-weight:900;
    font-size:7px;
    line-height:1.05;
    box-shadow:0 4px 10px #0006;
    cursor:pointer;
}

#goldenKeyButton:hover{
    filter:brightness(1.05);
}

#goldenKeyButton:disabled{
    opacity:.55;
    cursor:not-allowed;
}

#goldenKeyButton .key-icon{
    display:block;
    font-size:22px;
    line-height:20px;
}

#goldenKeyButton .key-label{
    display:block;
}

#goldenKeyToggleButton{
    position:fixed;
    right:15px;
    top:67px;
    z-index:1100;
    background:#ffd92e;
    color:#3b2a00;
    padding:10px 15px;
    border-radius:10px;
    box-shadow:0 5px 20px #0008;
    font-weight:900;
}

#goldenKeyPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1110;
    width:min(430px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow-y:auto;
    background:#222;
    border:1px solid #777;
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 35px #000b;
}

.golden-key-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.golden-key-header h3{
    margin:0;
}

#goldenKeyCloseButton{
    background:#444;
    color:#fff;
    padding:7px 10px;
}

#goldenKeyStatus{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.golden-key-player{
    background:#111;
    border-radius:10px;
    padding:10px;
    margin-bottom:9px;
}

.golden-key-player.me{
    border:1px solid #ffd92e;
}

.golden-key-player-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-weight:900;
    margin-bottom:7px;
}

.golden-key-count{
    color:#ffd92e;
    font-size:12px;
}

.golden-key-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.golden-key-item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    background:#1d1d1d;
    border-radius:8px;
    padding:8px;
}

.golden-key-text{
    flex:1;
    white-space:pre-wrap;
    line-height:1.4;
    font-size:13px;
}

.golden-key-return{
    flex-shrink:0;
    padding:5px 8px;
    background:#444;
    color:#fff;
    font-size:12px;
}

#goldenKeyCardOverlay{
    position:fixed;
    inset:0;
    z-index:2000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#0008;
}

#goldenKeyCard{
    width:min(520px,100%);
    min-height:240px;
    background:#fff4a8;
    color:#222;
    border:5px solid #d9aa00;
    border-radius:18px;
    box-shadow:0 15px 50px #000c;
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#goldenKeyCardTitle{
    font-size:24px;
    font-weight:1000;
    margin-bottom:22px;
    color:#7b5b00;
}

#goldenKeyCardText{
    width:100%;
    white-space:pre-wrap;
    font-size:20px;
    line-height:1.6;
    font-weight:800;
}

#goldenKeyCardButtons{
    display:flex;
    gap:8px;
    margin-top:25px;
}

#goldenKeyCardButtons button{
    min-width:110px;
    background:#7b5b00;
    color:#fff;
}

@media(max-width:600px){
    #goldenKeyButton{
        width:36px;
        min-height:21px;
        font-size:6px;
        padding:3px;
    }

    #goldenKeyButton .key-icon{
        font-size:11px;
    }

    #goldenKeyToggleButton{
        top:61px;
        right:10px;
        padding:8px 11px;
    }

    #goldenKeyPanel{
        top:10px;
        right:10px;
        max-height:calc(100vh - 20px);
    }

    #goldenKeyCard{
        padding:22px 16px;
        min-height:210px;
    }

    #goldenKeyCardText{
        font-size:17px;
    }
}


/* =========================
   게임 말
========================= */

#gamePieces{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:100;
}

.game-piece{
    position:absolute;
    width:6%;
    max-width:65px;
    min-width:30px;
    aspect-ratio:1;
    object-fit:contain;
    transform:translate(-50%,-50%);
    user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
    pointer-events:auto;
    cursor:grab;
}

.game-piece.other-piece{
    z-index:1;
}

.game-piece.my-piece{
    z-index:999;
}

.game-piece:active{
    cursor:grabbing;
}


/* =========================
   주사위
========================= */

#diceArea{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:center;
    z-index:20;
    pointer-events:none;
}

.dice{
    width:110px;
    height:110px;
    object-fit:contain;
    opacity:.8;
    filter:drop-shadow(0 4px 8px #0008);
}


/* =========================
   턴 순서
========================= */

#turnOrder{
    position:static;
    width:100%;
    background:#151515ee;
    border:1px solid #555;
    border-radius:14px;
    padding:12px 16px;
    box-shadow:0 5px 20px #0008;
}

.turn-title{
    font-weight:800;
    margin-bottom:9px;
    font-size:16px;
}

#turnList{
    display:flex;
    gap:10px;
    align-items:stretch;
    flex-wrap:wrap;
}

.turn-player{
    padding:8px 12px;
    border-radius:9px;
    background:#222;
    color:#bbb;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
    min-height:55px;
}

.turn-player.current{
    background:#fff;
    color:#111;
    font-weight:900;
}

.turn-player-image{
    width:40px;
    height:40px;
    object-fit:contain;
    flex-shrink:0;
}

.turn-player-info{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.turn-player-number{
    font-size:11px;
    opacity:.65;
}

.turn-player-name{
    font-size:14px;
}


/* =========================
   주사위 컨트롤
========================= */

#turnControls{
    position:static;
    width:100%;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:#151515ee;
    border:1px solid #555;
    border-radius:14px;
    padding:10px 14px;
    box-shadow:0 5px 20px #0008;
}

#turnStatus{
    font-size:14px;
    color:#ddd;
}

#rollDiceButton{
    min-width:160px;
    font-size:16px;
}


/* =========================
   금액 버튼
========================= */

#moneyToggleButton{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    background:#fff;
    color:#111;
    padding:10px 15px;
    border-radius:10px;

    box-shadow:0 5px 20px #0008;
}


/* =========================
   금액 패널
========================= */

#moneyPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    width:min(390px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow-y:auto;

    background:#222;
    border:1px solid #555;
    border-radius:16px;
    padding:18px;

    box-shadow:0 8px 35px #000b;
}

.money-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.money-header h3{
    margin:0;
}

#moneyCloseButton{
    background:#444;
    color:#fff;
    padding:7px 10px;
}


/* =========================
   플레이어별 금액
========================= */

.money-players{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:15px;
}

.money-player{
    background:#111;
    border-radius:9px;
    padding:9px 11px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.money-player.me{
    border:1px solid #fff;
}

.money-player-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
}

.money-player-balance{
    font-weight:900;
}

.me-badge{
    font-size:10px;
    background:#fff;
    color:#111;
    padding:2px 5px;
    border-radius:4px;
}


/* =========================
   지폐 선택
========================= */

.money-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.money-row{
    display:grid;
    grid-template-columns:55px 1fr 38px 42px 38px;
    gap:6px;
    align-items:center;

    background:#181818;
    border-radius:9px;
    padding:7px;
}

.money-image{
    width:50px;
    height:38px;
    object-fit:contain;
}

.money-label{
    font-weight:800;
}

.money-small-button{
    width:36px;
    height:36px;
    padding:0;
    background:#444;
    color:#fff;
}

.money-count{
    text-align:center;
    font-weight:900;
    min-width:30px;
}

.selected-money{
    background:#111;
    border-radius:10px;
    padding:11px;
    margin:14px 0 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.selected-money-value{
    font-weight:900;
}

.money-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.money-buttons button{
    background:#fff;
    color:#111;
}


/* =========================
   봉사점수
========================= */

.welfare-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #444;
}

.welfare-title{
    font-weight:900;
    margin-bottom:8px;
}

.welfare-fund{
    background:#111;
    border-radius:9px;
    padding:10px;
    margin-bottom:8px;
}

.welfare-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.welfare-buttons button{
    background:#444;
    color:#fff;
}


/* =========================
   입학사정관 직책
========================= */

.admission-officer-box{
    margin-top:14px;
    padding:12px;
    background:#171717;
    border:1px solid #555;
    border-radius:10px;
}

.admission-officer-title{
    font-weight:900;
    margin-bottom:5px;
}

.admission-officer-description{
    color:#aaa;
    font-size:12px;
    line-height:1.5;
    margin-bottom:9px;
}

#admissionOfficerSelect{
    width:100%;
    padding:10px 12px;
    border:1px solid #555;
    border-radius:9px;
    background:#111;
    color:#fff;
}

.score-manager-box{
    margin-bottom:12px;
    padding:10px;
    background:#181818;
    border-radius:9px;
}

.score-manager-label{
    display:block;
    font-size:12px;
    color:#aaa;
    margin-bottom:6px;
}

#scoreTargetPlayer{
    width:100%;
    padding:9px 10px;
    border:1px solid #555;
    border-radius:8px;
    background:#111;
    color:#fff;
}

/* =========================
   모바일
========================= */

@media(max-width:600px){

    .pieces{
        grid-template-columns:repeat(3,1fr);
    }

    #turnOrder{
        padding:10px;
    }

    #turnControls{
        flex-direction:column;
        gap:8px;
    }

    #moneyToggleButton{
        top:10px;
        right:10px;
    }

    #moneyPanel{
        top:10px;
        right:10px;
        max-height:calc(100vh - 20px);
    }

    .dice{
        width:75px;
        height:75px;
    }

    #diceArea{
        gap:8px;
    }
}
</style>
</head>


<body>


<!-- =========================
     로그인
========================= -->

<div id="loginScreen" class="screen">

    <div class="panel">

        <h1>대곽마블</h1>

        <p>닉네임을 입력해</p>

        <input
            id="nickname"
            maxlength="12"
            placeholder="닉네임"
        >

        <div class="row">

            <button id="createBtn">
                방 만들기
            </button>

            <button id="showJoinBtn">
                방 들어가기
            </button>

        </div>


        <div
            id="joinBox"
            class="hidden"
            style="margin-top:15px"
        >

            <input
                id="roomInput"
                maxlength="6"
                placeholder="방 코드"
            >

            <button
                id="joinBtn"
                style="width:100%"
            >
                입장
            </button>

        </div>


        <p
            id="loginError"
            class="error"
        ></p>

    </div>

</div>


<!-- =========================
     대기실
========================= -->

<div
    id="roomScreen"
    class="screen hidden"
>

    <div class="panel">

        <h2>방 대기실</h2>

        <div class="status">
            방 코드
        </div>

        <div
            id="roomCode"
            class="room-code"
        ></div>


        <h3>참가자</h3>

        <div id="players"></div>


        <h3>말 선택</h3>

        <div
            id="pieces"
            class="pieces"
        ></div>


        <p
            id="roomStatus"
            class="status"
        ></p>

        <div id="admissionOfficerBox" class="admission-officer-box hidden">
            <div class="admission-officer-title">입학사정관 직책</div>
            <div class="admission-officer-description">
                선택하지 않으면 각자가 자신의 성적을 관리해. 선택하면 입학사정관만 다른 사람의 성적을 관리할 수 있어.
            </div>
            <select id="admissionOfficerSelect">
                <option value="">직책 선택 안 함</option>
            </select>
            <div id="admissionOfficerStatus" class="status"></div>
        </div>


        <button
            id="startBtn"
            style="width:100%;margin-top:15px"
            disabled
        >
            게임 시작
        </button>

    </div>

</div>


<!-- =========================
     게임 화면
========================= -->

/* =========================
   교무실 / 선생님 데이터
========================= */
let staffList = [];

async function loadStaffList(){
    try{
        const response = await fetch("list.json", {cache:"no-store"});
        if(!response.ok) throw new Error(`list.json 불러오기 실패 (${response.status})`);
        const data = await response.json();
        const source = Array.isArray(data) ? data : (data.teachers || data.staff || data.list || []);
        if(!Array.isArray(source)) throw new Error("list.json의 선생님 목록 형식이 올바르지 않아");
        staffList = source.map((item, index) => {
            const color = item.color || item.colour || item.colorCode || "#7188c9";
            return {
                ...item,
                id: String(item.id ?? item.name ?? `staff_${index}`),
                name: String(item.name ?? item.이름 ?? `선생님 ${index + 1}`),
                color,
                basic: item.basic ?? item.기본 ?? 0,
                essay: item.essay ?? item.서술형 ?? 0,
                short: item.short ?? item.단답형 ?? 0,
                objective: item.objective ?? item.객관식 ?? 0,
                takenBasic: item.takenBasic ?? item.응시기본 ?? item.응시_기본 ?? 0,
                takenEssay: item.takenEssay ?? item.응시서술형 ?? item.응시_서술형 ?? 0,
                takenShort: item.takenShort ?? item.응시단답형 ?? item.응시_단답형 ?? 0,
                takenObjective: item.takenObjective ?? item.응시객관식 ?? item.응시_객관식 ?? 0
            };
        });
        state.staffList = staffList;
        renderStaffRoom();
    }catch(error){
        console.error("교무실 데이터 로드 오류:", error);
        staffList = [];
        state.staffList = [];
        const status = $("staffRoomStatus");
        if(status) status.textContent = "list.json을 불러오지 못했어. 파일을 확인해줘.";
    }
}

function getStaffValue(staff, keys){
    for(const key of keys){
        if(staff[key] !== undefined && staff[key] !== null) return staff[key];
    }
    return 0;
}

function getStaffOwnership(staffId){
    return state.staffOwnership?.[String(staffId)] || null;
}

function getCurrentPlayer(playerId){
    return state.players.find(player => player.playerId === playerId) || null;
}

function renderStaffRoom(){
    const names = $("staffRoomNames");
    const status = $("staffRoomStatus");
    if(!names || !status) return;
    names.innerHTML = "";
    status.textContent = staffList.length ? `선생님 ${staffList.length}명` : "등록된 선생님이 없어";
    staffList.forEach(staff => {
        const owner = getStaffOwnership(staff.id);
        const button = document.createElement("button");
        button.className = "staff-name-button" + (owner ? " owned" : "");
        button.textContent = owner ? `${staff.name} · 매수됨` : staff.name;
        button.style.borderColor = staff.color;
        button.onclick = () => showStaffDetail(staff.id);
        names.appendChild(button);
    });
    renderOwnedStaffList();
}

function renderOwnedStaffList(){
    const container = $("staffOwnedList");
    if(!container) return;
    container.innerHTML = "";
    const owned = staffList.filter(staff => {
        const owner = getStaffOwnership(staff.id);
        return owner && owner.playerId === state.playerId;
    });
    if(!owned.length){
        container.textContent = "아직 매수한 선생님이 없어.";
        container.style.color = "#aaa";
        return;
    }
    container.style.color = "";
    owned.forEach(staff => {
        const owner = getStaffOwnership(staff.id);
        const item = document.createElement("div");
        item.className = "staff-owned-item";
        item.style.borderColor = staff.color;
        item.innerHTML = `<div class="staff-owned-name">${escapeHtml(staff.name)}</div><div class="staff-owned-meta">${escapeHtml(owner.nickname || "이름 없음")} · 말 ${escapeHtml(owner.piece ?? "미선택")}</div>`;
        const button = document.createElement("button");
        button.className = "staff-buy-button";
        button.textContent = "팔기";
        button.onclick = () => sellStaff(staff.id);
        item.appendChild(button);
        container.appendChild(item);
    });
}

function showStaffDetail(staffId){
    const staff = staffList.find(item => String(item.id) === String(staffId));
    const card = $("staffDetailCard");
    if(!staff || !card) return;
    state.selectedStaff = staff.id;
    const basic = getStaffValue(staff,["basic","출제기본","출제_기본"]);
    const essay = getStaffValue(staff,["essay","서술형","출제서술형","출제_서술형"]);
    const short = getStaffValue(staff,["short","단답형","출제단답형","출제_단답형"]);
    const objective = getStaffValue(staff,["objective","객관식","출제객관식","출제_객관식"]);
    const takenBasic = getStaffValue(staff,["takenBasic","응시기본","응시_기본"]);
    const takenEssay = getStaffValue(staff,["takenEssay","응시서술형","응시_서술형"]);
    const takenShort = getStaffValue(staff,["takenShort","응시단답형","응시_단답형"]);
    const takenObjective = getStaffValue(staff,["takenObjective","응시객관식","응시_객관식"]);
    const owner = getStaffOwnership(staff.id);
    const currentPlayer = getCurrentPlayer(state.playerId);
    const requiredScore = Number(basic || 0) * 10000;
    const enoughScore = Number(currentPlayer?.balance || 0) >= requiredScore;
    const ownedByMe = owner?.playerId === state.playerId;
    const ownedByOther = !!owner && !ownedByMe;
    const buttonText = ownedByMe ? "내가 매수함" : ownedByOther ? `매수됨 · ${owner.nickname || "다른 플레이어"}` : "매수";
    const buttonClass = ownedByOther || ownedByMe ? "staff-buy-button staff-buy-owned" : "staff-buy-button";
    const disabled = ownedByOther || ownedByMe || !enoughScore;
    const ownerText = owner ? `<div class="staff-owned-meta">매수자: ${escapeHtml(owner.nickname || "이름 없음")} · 말: ${escapeHtml(owner.piece ?? "미선택")}</div>` : `<div class="staff-owned-meta">매수 조건: 기본 ${basic}점 · 현재 성적 ${formatMoney(currentPlayer?.balance || 0)}</div>`;
    card.style.setProperty("--staff-color", staff.color || "#7188c9");
    card.innerHTML = `
        <div class="staff-detail-line"></div>
        <div class="staff-detail-name">${escapeHtml(staff.name)}</div>
        <hr class="staff-detail-divider">
        <div class="staff-detail-row"><b>출제</b> : 기본 ${basic}점, 서술형 ${essay}점, 단답형 ${short}점, 객관식 ${objective}점</div>
        <div class="staff-detail-row"><b>응시</b> : 기본 ${takenBasic}점, 서술형 ${takenEssay}점, 단답형 ${takenShort}점, 객관식 ${takenObjective}점</div>
        <hr class="staff-detail-divider">
        ${ownerText}
        <button class="${buttonClass}" ${disabled ? "disabled" : ""} onclick="buyStaff('${String(staff.id).replace(/'/g,"\\'")}')">${buttonText}</button>
        ${!owner && !enoughScore ? `<div class="staff-owned-meta">성적이 부족해서 매수할 수 없어.</div>` : ""}
        <div class="staff-detail-line" style="margin-top:13px;margin-bottom:0"></div>
    `;
    card.classList.remove("hidden");
}

async function buyStaff(staffId){
    const staff = staffList.find(item => String(item.id) === String(staffId));
    if(!staff || !state.roomCode || !state.playerId) return;
    const existing = getStaffOwnership(staff.id);
    if(existing){
        alert(existing.playerId === state.playerId ? "이미 내가 매수한 선생님이야." : "이미 다른 플레이어가 매수한 선생님이야.");
        return;
    }
    const player = getCurrentPlayer(state.playerId);
    const requiredScore = Number(getStaffValue(staff,["basic","출제기본","출제_기본"]) || 0) * 10000;
    if(Number(player?.balance || 0) < requiredScore){
        alert("기본 점수가 부족해서 매수할 수 없어.");
        return;
    }
    const piece = player?.piece ?? "미선택";
    const ownershipRef = ref(db, `rooms/${state.roomCode}/staffOwnership/${staff.id}`);
    const result = await runTransaction(ownershipRef, current => {
        if(current) return;
        return {
            playerId: state.playerId,
            nickname: player?.nickname || state.nickname || "이름 없음",
            piece,
            purchasedAt: Date.now()
        };
    });
    if(result.committed){
        renderStaffRoom();
        showStaffDetail(staff.id);
    }else{
        alert("이미 다른 플레이어가 먼저 매수했어.");
    }
}

async function sellStaff(staffId){
    const owner = getStaffOwnership(staffId);
    if(!owner || owner.playerId !== state.playerId) return;
    await set(ref(db, `rooms/${state.roomCode}/staffOwnership/${staffId}`), null);
    renderStaffRoom();
    if(state.selectedStaff === staffId) showStaffDetail(staffId);
}

    const section = $("staffBoardSection");
    if(section) section.classList.toggle("hidden");

window.toggleStaffRoomPanel = function(){

/* =========================
   황금열쇠 데이터
========================= */

let goldenKeyCards = [];
let renderedGoldenKeyDrawId = null;
let initializedGoldenKeyDrawState = false;

async function loadGoldenKeyCards(){

    try{

        const response = await fetch("key.json", {
            cache: "no-store"
        });

        if(!response.ok){
            throw new Error(`key.json 불러오기 실패 (${response.status})`);
        }

        const data = await response.json();

        if(!Array.isArray(data)){
            throw new Error("key.json 형식이 올바르지 않아");
        }

        goldenKeyCards = data
            .filter(card => card && card.id != null && typeof card.text === "string")
            .map(card => ({
                id: String(card.id),
                text: card.text
            }));

        if(goldenKeyCards.length === 0){
            throw new Error("key.json에 황금열쇠가 없어");
        }

        if(typeof renderGoldenKeyButton === "function"){
            renderGoldenKeyButton();
        }

        if(typeof renderGoldenKeyPlayers === "function"){
            renderGoldenKeyPlayers();
            renderStaffRoom();
        }

    }catch(error){

        console.error("황금열쇠 데이터 로드 오류:", error);

function getPlayerId(){

        );


    if(!id){

        id =

function formatMoney(value){

    return (
        score.toLocaleString("ko-KR") +
        "점"
    );

}


/* =========================
   방 코드
========================= */

function makeRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";


    for(let i = 0; i < 6; i++){

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}

        return;

    try{

        let code;

        for(
            let i = 0;
            i < 20 && exists;
            i++
        ){

            code =
                makeRoomCode();


            const snapshot =
                await get(
                    ref(
                        db,
                        `rooms/${code}`
                    )
                );

                snapshot.exists();

        }


        if(exists){

            throw new Error(
                "방 코드 생성에 실패했어"
            );

        }


        state.roomCode =
            code;


        state.hostId =
            state.playerId;


        state.isHost =
            true;


        await set(

            ref(
                db,

                gameStarted:

/* =========================
   실시간 방 감시
========================= */

function watchRoom(){

    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    onValue(
        roomRef,
        snapshot => {

            if(!snapshot.exists()){

                alert(
                    "방이 삭제됐어"
                );


                location.reload();


                return;

            }


            const data =
                snapshot.val();


            state.hostId =
                data.hostId || null;


            state.isHost =
                state.hostId ===
                state.playerId;


            state.admissionOfficerId =
                data.admissionOfficerId || null;


            state.players =
                Object.values(
                    data.players || {}
                );


            state.turnOrder =
                data.turnOrder || [];


            state.currentTurnIndex =
                data.currentTurnIndex || 0;


            state.gameStarted =
                !!data.gameStarted;


            state.diceRolling =
                !!data.diceRolling;


            state.welfareFund =
                data.welfareFund || 0;


            state.keyCards =
                data.keyCards || {};


            state.lastKeyDraw =
                data.lastKeyDraw || null;

            state.lastKeyDrawByPlayer =
                data.lastKeyDrawByPlayer || {};

            state.staffOwnership =
                data.staffOwnership || {};


            if(state.gameStarted){

                showGame();

            }else{

                showRoom();

            }


            renderPlayers();
            renderAdmissionOfficerSelector();

            renderPieceSelection();

            renderMoneyPlayers();

            renderGoldenKeyPlayers();

            const myLastKeyDraw =
                state.lastKeyDrawByPlayer?.[state.playerId] || null;

            if(!initializedGoldenKeyDrawState){

                renderedGoldenKeyDrawId =
                    myLastKeyDraw?.timestamp || null;

                initializedGoldenKeyDrawState = true;

            }else if(
                myLastKeyDraw &&
                myLastKeyDraw.timestamp !== renderedGoldenKeyDrawId
            ){

                renderedGoldenKeyDrawId =
                    myLastKeyDraw.timestamp;

                renderGoldenKeyCard(myLastKeyDraw);

            }

            renderTurnOrder();

            renderTurnControls();

            renderGoldenKeyButton();

            renderGamePieces();

            updateSelectedMoney();


            $("welfareFund")
                .textContent =
                formatMoney(
                    state.welfareFund
                );


            const dice1 =
                Number(
                    data.dice1 || 1
                );


            const dice2 =
                Number(
                    data.dice2 || 1
                );


            /*
              평소에는 현재 Firebase 결과를
              그대로 그린다.

              단, 주사위 애니메이션 중에는
              애니메이션이 화면을 담당한다.
            */

            if(
                !state.diceAnimating
            ){

                $("dice1").src =
                    `dice/dice${dice1}.png`;


                $("dice2").src =
                    `dice/dice${dice2}.png`;

            }


            const rollId =
                data.diceRollId;


            /*
              새로운 주사위 굴림을
              Firebase에서 처음 발견한 순간
              랜덤 애니메이션을 시작한다.
            */

            if(
                rollId &&
                rollId !==
                state.lastDiceRollId
            ){

                state.lastDiceRollId =
                    rollId;


                state.diceResult1 =
                    dice1;


                state.diceResult2 =
                    dice2;


                startDiceAnimation();

            }

        },

        error => {

            console.error(error);


            $("loginError").textContent =
                "Firebase 오류: " +
                error.message;

        }

    );

}

/* =========================

========================= */

function renderAdmissionOfficerSelector(){

    const box = $("admissionOfficerBox");
    const select = $("admissionOfficerSelect");
    const status = $("admissionOfficerStatus");

    if(!box || !select){
        return;
    }

    box.classList.toggle("hidden", !state.isHost);

    select.innerHTML = "";

    const none = document.createElement("option");
    none.value = "";
    none.textContent = "직책 선택 안 함";
    select.appendChild(none);

    for(const player of state.players){
        const option = document.createElement("option");
        option.value = player.playerId;
        option.textContent = player.nickname || "이름 없음";
        select.appendChild(option);
    }

    select.value = state.admissionOfficerId || "";

    const officer = state.players.find(p => p.playerId === state.admissionOfficerId);
    if(status){
        status.textContent = officer
            ? `현재 입학사정관: ${officer.nickname}`
            : "현재 입학사정관 없음. 각자가 자신의 성적을 관리해.";
    }
}

async function updateAdmissionOfficer(playerId){

    if(!state.isHost || state.gameStarted){
        return;
    }

    try{
        const result = await runTransaction(
            ref(db, `rooms/${state.roomCode}`),
            room => {
                if(!room || room.gameStarted || room.hostId !== state.playerId){
                    return;
                }

                if(playerId && !room.players?.[playerId]){
                    return;
                }

                room.admissionOfficerId = playerId || null;
                return room;
            }
        );

        if(!result.committed){
            alert("입학사정관 직책을 변경할 수 없어.");
        }
    }catch(error){
        console.error("입학사정관 설정 오류:", error);
    }
}


/* =========================
   참가자 표시
========================= */

function renderPlayers(){

    const container =
        $("players");


    container.innerHTML = "";


    const sorted =
        [...state.players]
            .sort(
                (a,b) => {

                    if(
                        a.playerId ===
                        state.playerId
                    ){

                        return -1;

                    }


                    if(
                        b.playerId ===
                        state.playerId
                    ){

                        return 1;

                    }


                    return (
                        (a.joinedAt || 0) -
                        (b.joinedAt || 0)
                    );

                }
            );


    for(
        const player
        of sorted
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "player";


        const left =
            document.createElement(
                "div"
            );


        left.className =
            "player-left";


        const name =
            document.createElement(
                "span"
            );


        name.textContent =
            player.nickname ||
            "이름 없음";


        if(
            player.playerId ===
            state.playerId
        ){

            name.classList.add(
                "player-me"
            );

        }


        left.appendChild(name);


        if(
            player.playerId ===
            state.playerId
        ){

            const me =
                document.createElement(
                    "span"
                );


            me.className =
                "host-badge";


            me.textContent =
                "나";


            left.appendChild(me);

        }


        if(
            player.playerId ===
            state.hostId
        ){

            const host =
                document.createElement(
                    "span"
                );


            host.className =
                "host-badge";


            host.textContent =
                "방장";


            left.appendChild(host);

        }


        const right =
            document.createElement(
                "span"
            );


        right.className =
            "player-piece";


        right.textContent =
            player.piece
                ? `P${player.piece}`
                : "말 미선택";


        div.append(
            left,
            right
        );


        container.appendChild(div);

    }


    const everyoneHasPiece =
        state.players.length > 0 &&
        state.players.every(
            player =>
                !!player.piece
        );


    $("startBtn").disabled =
        !state.isHost ||
        !everyoneHasPiece;

}


/* =========================
   말 선택
========================= */

function renderPieceSelection(){

    const container =
        $("pieces");


    container.innerHTML = "";


    const usedByOthers =
        state.players
            .filter(
                player =>
                    player.playerId !==
                    state.playerId
            )
            .map(
                player =>
                    Number(player.piece)
            )
            .filter(
                Boolean
            );


    const me =
        state.players.find(
            player =>
                player.playerId ===
                state.playerId
        );


    const myPiece =
        me?.piece
            ? Number(me.piece)
            : null;


    state.selectedPiece =
        myPiece;


    for(
        const piece
        of state.pieces
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "piece";


        const isMine =
            piece ===
            myPiece;


        const isUsed =
            usedByOthers.includes(
                piece
            );


        if(isMine){

            div.classList.add(
                "selected"
            );

        }


        if(isUsed){

            div.classList.add(
                "used"
            );

        }


        const img =
            document.createElement(
                "img"
            );


        img.src =
            `P/P${piece}.png`;


        img.alt =
            `P${piece}`;


        img.onerror =
            () => {

                img.style.display =
                    "none";

            };


        const label =
            document.createElement(
                "small"
            );


        if(isMine){

            label.textContent =
                "내 말";

        }else if(isUsed){

            label.textContent =
                "사용 중";

        }else{

            label.textContent =
                `P${piece}`;

        }


        div.append(
            img,
            label
        );


        if(!isUsed){

            div.addEventListener(
                "click",
                () =>
                    selectPiece(piece)
            );

        }


        container.appendChild(div);

    }

}


/* =========================
   말 선택 저장
========================= */

async function selectPiece(piece){

    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players`
                ),

                players => {

                    if(!players){

                        return;

                    }


                    const me =
                        players[
                            state.playerId
                        ];


                    if(!me){

                        return;

                    }


                    for(
                        const [
                            playerId,
                            player
                        ]
                        of Object.entries(
                            players
                        )
                    ){

                        if(
                            playerId !==
                            state.playerId &&
                            Number(player.piece) ===
                            Number(piece)
                        ){

                            return;

                        }

                    }


                    me.piece =
                        piece;


                    return players;

                }

            );


        if(!result.committed){

            return;

        }


        state.selectedPiece =
            piece;


        renderPieceSelection();

        renderPlayers();


    }catch(error){

        console.error(
            "말 선택 오류:",
            error
        );


        $("roomStatus").textContent =
            "말 선택에 실패했어: " +
            error.message;

    }

}


/* =========================
   게임 시작
========================= */

async function startGame(){

    if(!state.isHost){

        return;

    }


    try{

        await runTransaction(

            ref(
                db,
                `rooms/${state.roomCode}`
            ),

            room => {

                if(!room){

                    return;

                }


                if(
                    room.hostId !==
                    state.playerId
                ){

                    return;

                }


                if(room.gameStarted){

                    return;

                }


                const players =
                    Object.values(
                        room.players || {}
                    );


                if(
                    players.length === 0
                ){

                    return;

                }


                if(
                    !players.every(
                        player =>
                            !!player.piece
                    )
                ){

                    return;

                }


                const order =
                    players
                        .map(
                            player =>
                                player.playerId
                        )
                        .sort(
                            () =>
                                Math.random() -
                                0.5
                        );


                room.gameStarted =
                    true;


                room.turnOrder =
                    order;


                room.currentTurnIndex =
                    0;


                room.dice1 =
                    1;


                room.dice2 =
                    1;


                room.diceRolling =
                    false;


                room.diceRollId =
                    null;


                room.welfareFund =
                    0;


                return room;

            }

        );


    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   게임판 말 표시
========================= */

function renderGamePieces(){

    const container =
        $("gamePieces");


    container.innerHTML = "";


    const others =
        state.players.filter(
            player =>
                player.playerId !==
                state.playerId
        );

        );

function createGamePiece(
    player,
    isMine
){

    if(!player.piece){

        return;

    }


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "game-piece";


    img.classList.add(
        isMine
            ? "my-piece"
            : "other-piece"
    );


    img.src =
        `P/P${player.piece}.png`;


    img.alt =
        player.nickname ||
        `P${player.piece}`;


    img.style.left =
        `${player.x ?? 50}%`;


    img.style.top =
        `${player.y ?? 50}%`;


    if(isMine){

        enablePieceDrag(
            img
        );

    }else{

        img.style.cursor =
            "default";

    }


    $("gamePieces")
        .appendChild(img);

}


/* =========================
   말 드래그
========================= */

function enablePieceDrag(img){

    let dragging =
        false;


    function getPosition(event){

        const board =
            document.querySelector(
                ".board-wrap"
            );


        const rect =
            board.getBoundingClientRect();


        let x =
            (
                (event.clientX - rect.left)
                /
                rect.width
            ) * 100;


        let y =
            (
                (event.clientY - rect.top)
                /
                rect.height
            ) * 100;


        x =
            Math.max(
                0,
                Math.min(
                    100,
                    x
                )
            );


        y =
            Math.max(
                0,
                Math.min(
                    100,
                    y
                )
            );


        return {
            x,
            y
        };

    }


    img.addEventListener(
        "pointerdown",
        event => {

            dragging =
                true;


            state.dragging =
                true;


            img.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    img.addEventListener(
        "pointermove",
        event => {

            if(!dragging){

                return;

            }


            const {
                x,
                y
            } =
                getPosition(event);


            img.style.left =
                `${x}%`;


            img.style.top =
                `${y}%`;

        }
    );


    img.addEventListener(
        "pointerup",
        async event => {

            if(!dragging){

                return;

            }


            dragging =
                false;


            state.dragging =
                false;


            const {
                x,
                y
            } =
                getPosition(event);


            img.style.left =
                `${x}%`;


            img.style.top =
                `${y}%`;


            try{

                await update(

                    ref(
                        db,
                        `rooms/${state.roomCode}/players/${state.playerId}`
                    ),

                    {
                        x,
                        y
                    }

                );

            }catch(error){

                console.error(
                    "말 위치 저장 오류:",
                    error
                );

window.rollDice =
async function(){

    if(state.diceRolling){

        return;

    }


    if(!state.gameStarted){

        return;

    }


    const currentPlayerId =
        state.turnOrder[
            state.currentTurnIndex
        ];


    if(
        currentPlayerId !==
        state.playerId
    ){

        return;

    }


    /*
      실제 결과는 여기서 생성하지만
      화면에는 직접 표시하지 않는다.

      최종 결과는 반드시 Firebase에서
      다시 읽은 값을 사용한다.
    */

    const final1 =
        randomDiceValue();


    const final2 =
        randomDiceValue();


    state.diceRolling =
        true;


    renderTurnControls();


    try{

        await update(

            ref(
                db,
                `rooms/${state.roomCode}`
            ),

            {

                dice1:
                    final1,

                dice2:
                    final2,

                diceRolling:
                    true,

                diceRollId:
                    Date.now()

            }

        );


        /*
          결과를 Firebase에 기록한 뒤에는
          여기서 화면을 확정하지 않는다.

          모든 화면이 onValue에서
          동일하게 Firebase 결과를 받아
          애니메이션을 시작한다.
        */

        waitForDiceAnimationThenFinish();

    }catch(error){

        console.error(
            error
        );


        state.diceRolling =
            false;


        renderTurnControls();

    }

};


function randomDiceValue(){

    return (
        Math.floor(
            Math.random() * 6
        ) + 1
    );

}


/* =========================
   주사위 애니메이션 시작
========================= */

function startDiceAnimation(){

    /*
      혹시 이전 애니메이션이 남아 있다면
      정리한다.
    */

    stopDiceAnimation();


    state.diceAnimating =
        true;


    /*
      Firebase에서 읽어온 최종 결과를
      별도로 저장한다.
    */

    const final1 =
        state.diceResult1;


    const final2 =
        state.diceResult2;


    let speed =
        55;


    /*
      처음에는 빠르게 랜덤 숫자를
      계속 보여준다.
    */

    function spin(){

        if(
            !state.diceAnimating
        ){

            return;

        }


        /*
          결과값을 직접 보여주지 않고
          계속 랜덤 숫자를 보여준다.
        */

        $("dice1").src =
            `dice/dice${randomDiceValue()}.png`;


        $("dice2").src =
            `dice/dice${randomDiceValue()}.png`;


        state.diceAnimationTimer =
            setTimeout(
                spin,
                speed
            );

    }


    spin();


    /*
      Firebase 결과를 이미 읽었으므로
      잠깐 더 굴린 뒤 감속해서 멈춘다.

      이 시간이 지나면 반드시
      Firebase에서 읽은 값으로 끝난다.
    */

    state.diceStopTimer =
        setTimeout(
            () => {

                finishDiceAnimation(
                    final1,
                    final2
                );

            },
            450
        );

}


/* =========================
   주사위 애니메이션 종료
========================= */

function finishDiceAnimation(
    final1,
    final2
){

    if(
        !state.diceAnimating
    ){

        return;

    }


    if(
        state.diceAnimationTimer
    ){

        clearTimeout(
            state.diceAnimationTimer
        );


        state.diceAnimationTimer =
            null;

    }


    if(
        state.diceStopTimer
    ){

        clearTimeout(
            state.diceStopTimer
        );


        state.diceStopTimer =
            null;

    }


    /*
      랜덤 → 느림 → 최종 결과
    */

    let count =
        0;


    function slowStop(){

        count++;


        if(
            count <= 3
        ){

            $("dice1").src =
                `dice/dice${randomDiceValue()}.png`;


            $("dice2").src =
                `dice/dice${randomDiceValue()}.png`;


            setTimeout(
                slowStop,
                80 + count * 60
            );


            return;

        }


        /*
          마지막 프레임은 무조건
          Firebase에서 읽은 결과
        */

        $("dice1").src =
            `dice/dice${final1}.png`;


        $("dice2").src =
            `dice/dice${final2}.png`;


        state.diceAnimating =
            false;


        state.diceResult1 =
            null;


        state.diceResult2 =
            null;

    }


    slowStop();

}


/* =========================
   주사위 애니메이션 정리
========================= */

function stopDiceAnimation(){

    if(
        state.diceAnimationTimer
    ){

        clearTimeout(
            state.diceAnimationTimer
        );


        state.diceAnimationTimer =
            null;

    }


    if(
        state.diceStopTimer
    ){

        clearTimeout(
            state.diceStopTimer
        );


        state.diceStopTimer =
            null;

    }


    state.diceAnimating =
        false;

}


/* =========================
   주사위 턴 처리
========================= */

function waitForDiceAnimationThenFinish(){

    /*
      Firebase에 diceRolling=true가
      들어간 뒤 약간 기다렸다가
      결과 처리를 한다.

      실제 화면의 최종 숫자는
      이미 Firebase에서 읽어온 값만
      사용한다.
    */

    setTimeout(
        async () => {

            try{

                await runTransaction(

                    ref(
                        db,
                        `rooms/${state.roomCode}`
                    ),

                    room => {

                        if(!room){

                            return;

                        }


                        if(
                            !room.diceRolling
                        ){

                            return;

                        }


                        const order =
                            room.turnOrder ||
                            [];


                        if(
                            order.length === 0
                        ){

                            room.diceRolling =
                                false;


                            return room;

                        }


                        room.diceRolling =
                            false;


                        /*
                          Firebase에 저장된
                          실제 주사위 결과로
                          더블 여부를 판단한다.
                        */

                        const dice1 =
                            Number(
                                room.dice1 || 1
                            );


                        const dice2 =
                            Number(
                                room.dice2 || 1
                            );


                        const isDouble =
                            dice1 === dice2;


                        /*
                          더블이면 현재 턴 유지
                        */

                        if(isDouble){

                            return room;

                        }


                        /*
                          더블이 아니면 다음 턴
                        */

                        room.currentTurnIndex =
                            (
                                (
                                    room.currentTurnIndex ||
                                    0
                                ) + 1
                            )
                            %
                            order.length;


                        return room;

                    }

                );


            }catch(error){

                console.error(
                    "주사위 턴 처리 오류:",
                    error
                );

            }

        },
        600
    );

}

window.drawGoldenKey = async function(){

    if(!state.gameStarted){
        return;
    }

    if(!goldenKeyCards.length){
        alert("황금열쇠 데이터를 아직 불러오지 못했어.");
        return;
    }

    const button = $("goldenKeyButton");
    button.disabled = true;

    try{

        const result = await runTransaction(
            ref(db, `rooms/${state.roomCode}`),
            room => {

                if(!room || !room.gameStarted){
                    return;
                }

                const keyCards = room.keyCards || {};

                const available =
                    goldenKeyCards.filter(card => !keyCards[card.id]);

                if(available.length === 0){
                    return;
                }

                const selected =
                    available[Math.floor(Math.random() * available.length)];

                keyCards[selected.id] = state.playerId;

                room.keyCards = keyCards;
                const draw = {
                    id: selected.id,
                    text: selected.text,
                    playerId: state.playerId,
                    timestamp: Date.now()
                };

                room.lastKeyDraw = draw;
                room.lastKeyDrawByPlayer = room.lastKeyDrawByPlayer || {};
                room.lastKeyDrawByPlayer[state.playerId] = draw;

                return room;

            }
        );

        if(!result.committed){
            const ownedCount = Object.keys(state.keyCards || {}).length;

            if(ownedCount >= goldenKeyCards.length){
                alert("남아 있는 황금열쇠가 없어. 반납하면 다시 뽑을 수 있어.");
            }else{
                alert("지금은 황금열쇠를 뽑을 수 없어.");
            }
        }

    }catch(error){

        console.error("황금열쇠 뽑기 오류:", error);
        alert("황금열쇠를 뽑는 중 오류가 발생했어.");

    }finally{

        button.disabled = false;

    }

};

function renderMoneyPlayers(){

    const container = $("moneyPlayers");
    if(!container){
        return;
    }

    container.innerHTML = "";

    const officerMode = !!state.admissionOfficerId;
    const canManageScores = !officerMode || state.admissionOfficerId === state.playerId;

    // 입학사정관이 아니어도 전체 플레이어의 성적 목록은 볼 수 있어.
    const visiblePlayers = [...state.players];

    const sorted = visiblePlayers.sort((a,b) => {
        if(a.playerId === state.playerId) return -1;
        if(b.playerId === state.playerId) return 1;
        return (a.joinedAt || 0) - (b.joinedAt || 0);
    });

    if(officerMode && canManageScores){
        const box = $("scoreManagerBox");
        const select = $("scoreTargetPlayer");
        if(box && select){
            box.classList.remove("hidden");
            select.innerHTML = "";
            for(const player of state.players){
                const option = document.createElement("option");
                option.value = player.playerId;
                option.textContent = player.nickname || "이름 없음";
                select.appendChild(option);
            }
            if(!state.scoreTargetPlayerId || !state.players.some(p => p.playerId === state.scoreTargetPlayerId)){
                state.scoreTargetPlayerId = state.playerId;
            }
            select.value = state.scoreTargetPlayerId;
        }
    }else{
        $("scoreManagerBox")?.classList.add("hidden");
    }

    for(const player of sorted){
        const row = document.createElement("div");
        row.className = "money-player";
        if(player.playerId === state.playerId) row.classList.add("me");

        const name = document.createElement("div");
        name.className = "money-player-name";
        name.textContent = player.nickname || "이름 없음";

        if(player.playerId === state.playerId){
            const badge = document.createElement("span");
            badge.className = "me-badge";
            badge.textContent = "나";
            name.appendChild(badge);
        }

        const balance = document.createElement("div");
        balance.className = "money-player-balance";
        balance.textContent = formatMoney(player.balance || 0);

        row.append(name, balance);
        container.appendChild(row);
    }

    // 입학사정관이 아닌 플레이어는 점수 조작 UI를 숨기고 목록만 볼 수 있어.
    // 입학사정관 직책을 선택하지 않은 경우에는 각자 자신의 성적을 관리할 수 있어.
    const controlIds = ["moneyControls", "selectedMoneyBox", "moneyActionButtons"];
    for(const id of controlIds){
        const element = $(id);
        if(element){
            element.classList.toggle("hidden", officerMode && !canManageScores);
        }
    }

    const label = document.querySelector("#moneyPanel .money-header h3");
    if(label){
        label.textContent = officerMode
            ? (canManageScores ? "📋 성적 관리" : "📋 전체 성적")
            : "📋 성적 관리";
    }
}

function getScoreTargetId(){

        ? (state.scoreTargetPlayerId || state.playerId)
        : state.playerId;
}

async function(){

        alert("입학사정관만 다른 사람의 성적을 관리할 수 있어.");
        return;
    }

    const amount =
        getSelectedMoney();


    if(amount <= 0){

    }


    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players/${getScoreTargetId()}/balance`
                ),

                balance =>
                    (balance || 0) +
                    amount

            );


        if(result.committed){

            resetMoneyCounts();

    }catch(error){

        console.error(
            "돈 받기 오류:",
            error
        );

window.payMoney =
async function(){

    if(!canManageScore()){
        alert("입학사정관만 다른 사람의 성적을 관리할 수 있어.");
        return;
    }

    const amount =
        getSelectedMoney();

    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players/${getScoreTargetId()}/balance`
                ),

                balance => {

                    balance =
                        balance || 0;


                    if(
                        balance <
                        amount
                    ){

                        return;

                    }


                    return (
                        balance -
                        amount
                    );

                }

            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );


            return;

        }


        resetMoneyCounts();

    }catch(error){

        console.error(
            "돈 내기 오류:",
            error
        );

    }

};

window.payWelfareFund =
async function(){

    const amount =
        150000;


    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}`
                ),

                room => {

                    if(!room){

                        return;

                    }


                    const player =
                        room.players?.[
                            state.playerId
                        ];


                    if(!player){

                        return;

                    }


                    const balance =
                        player.balance ||
                        0;


                    if(
                        balance <
                        amount
                    ){

                        return;

                    }


                    player.balance =
                        balance -
                        amount;


                    room.welfareFund =
                        (
                            room.welfareFund ||
                            0
                        ) +
                        amount;


                    return room;

                }

            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );

        }

    }catch(error){

        console.error(
            "점수 내기 오류:",
            error
        );

    }

};


/* =========================
   봉사점수 받기
========================= */

window.receiveWelfareFund =
async function(){

    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}`
                ),

                room => {

                    if(!room){

                        return;

                    }


                    const fund =
                        room.welfareFund ||
                        0;


                    if(fund <= 0){

                        return;

                    }


                    const player =
                        room.players?.[
                            state.playerId
                        ];


                    if(!player){

                        return;

                    }


                    player.balance =
                        (
                            player.balance ||
                            0
                        ) +
                        fund;


                    room.welfareFund =
                        0;


                    return room;

                }

            );


        if(!result.committed){

            return;

        }

    }catch(error){

        console.error(
            "점수 받기 오류:",
            error
        );

    }

};

async function checkPieceImages(){

    const loaded = [];


    for(
        const piece
        of [1,2,3,4,5]
    ){

        const exists =
            await new Promise(
                resolve => {

                    const img =
                        new Image();


                    img.onload =
                        () =>
                            resolve(true);


                    img.onerror =
                        () =>
                            resolve(false);


                    img.src =
                        `P/P${piece}.png`;

                }
            );


        if(exists){

            loaded.push(
                piece
            );

        }

    }


    state.pieces =
        loaded;


    renderPieceSelection();

}
