<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대곽마블</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#151515;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.hidden{
    display:none!important;
}


/* =========================
   로그인 / 대기실
========================= */

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.panel{
    width:min(560px,100%);
    background:#242424;
    border-radius:20px;
    padding:28px;
    box-shadow:0 12px 40px #0006;
}

h1,
h2{
    margin-top:0;
}

input{
    width:100%;
    padding:13px 15px;
    border:1px solid #555;
    border-radius:10px;
    background:#171717;
    color:#fff;
    outline:none;
    margin-bottom:10px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#fff;
    color:#111;
    font-weight:700;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.row>*{
    flex:1;
}

.room-code{
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
    text-align:center;
    padding:12px;
    background:#111;
    border-radius:12px;
    margin:12px 0 20px;
}

.status{
    color:#bbb;
    font-size:14px;
    margin:8px 0;
}

.error{
    color:#ff7d7d;
    white-space:pre-wrap;
}


/* =========================
   참가자
========================= */

#players{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:10px 0 20px;
}

.player{
    background:#181818;
    padding:10px 12px;
    border-radius:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.player-me{
    font-weight:900;
}

.host-badge{
    font-size:11px;
    background:#fff;
    color:#111;
    padding:3px 6px;
    border-radius:5px;
}

.player-piece{
    color:#aaa;
    font-size:12px;
}


/* =========================
   말 선택
========================= */

.pieces{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:10px;
}

.piece{
    min-height:105px;
    padding:8px;
    background:#171717;
    border:2px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    border-radius:10px;
    user-select:none;
    cursor:pointer;
}

.piece.selected{
    border-color:#fff;
    background:#303030;
}

.piece.used{
    opacity:.35;
    cursor:not-allowed;
}

.piece img{
    width:65px;
    height:65px;
    object-fit:contain;
}

.piece small{
    font-size:12px;
    color:#aaa;
}


/* =========================
   게임 화면
========================= */

#gameScreen{
    display:none;
    min-height:100vh;
    padding:15px;
    justify-content:center;
    align-items:flex-start;
}

.board-wrap{
    position:relative;
    width:min(100%,1000px);
    z-index:1;
}

.board-image{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
}


/* =========================
   게임 말
========================= */

#gamePieces{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:100;
}

.game-piece{
    position:absolute;
    width:6%;
    max-width:65px;
    min-width:30px;
    aspect-ratio:1;
    object-fit:contain;
    transform:translate(-50%,-50%);
    user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
    pointer-events:auto;
    cursor:grab;
}

.game-piece.other-piece{
    z-index:1;
}

.game-piece.my-piece{
    z-index:999;
}

.game-piece:active{
    cursor:grabbing;
}


/* =========================
   주사위
========================= */

#diceArea{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:15px;
    align-items:center;
    justify-content:center;
    z-index:20;
    pointer-events:none;
}

.dice{
    width:110px;
    height:110px;
    object-fit:contain;
    opacity:.8;
    filter:drop-shadow(0 4px 8px #0008);
}


/* =========================
   턴 순서
========================= */

#turnOrder{
    position:fixed;
    top:15px;
    left:15px;
    z-index:1000;

    background:#151515ee;
    border:1px solid #555;
    border-radius:12px;
    padding:10px 13px;
    min-width:160px;

    box-shadow:0 5px 20px #0008;
}

.turn-title{
    font-weight:800;
    margin-bottom:7px;
}

.turn-player{
    padding:4px 7px;
    border-radius:6px;
    color:#bbb;
    font-size:14px;
}

.turn-player.current{
    background:#fff;
    color:#111;
    font-weight:900;
}


/* =========================
   주사위 컨트롤
========================= */

#turnControls{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:1000;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;

    background:#151515ee;
    border:1px solid #555;
    border-radius:14px;
    padding:10px 14px;

    box-shadow:0 5px 20px #0008;
}

#turnStatus{
    font-size:14px;
    color:#ddd;
}

#rollDiceButton{
    min-width:160px;
    font-size:16px;
}


/* =========================
   금액 버튼
========================= */

#moneyToggleButton{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    background:#fff;
    color:#111;
    padding:10px 15px;
    border-radius:10px;

    box-shadow:0 5px 20px #0008;
}


/* =========================
   금액 패널
========================= */

#moneyPanel{
    position:fixed;
    right:15px;
    top:15px;
    z-index:1100;

    width:min(390px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow-y:auto;

    background:#222;
    border:1px solid #555;
    border-radius:16px;
    padding:18px;

    box-shadow:0 8px 35px #000b;
}

.money-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.money-header h3{
    margin:0;
}

#moneyCloseButton{
    background:#444;
    color:#fff;
    padding:7px 10px;
}


/* =========================
   플레이어별 금액
========================= */

.money-players{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:15px;
}

.money-player{
    background:#111;
    border-radius:9px;
    padding:9px 11px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.money-player.me{
    border:1px solid #fff;
}

.money-player-name{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
}

.money-player-balance{
    font-weight:900;
}

.me-badge{
    font-size:10px;
    background:#fff;
    color:#111;
    padding:2px 5px;
    border-radius:4px;
}


/* =========================
   지폐 선택
========================= */

.money-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.money-row{
    display:grid;
    grid-template-columns:55px 1fr 38px 42px 38px;
    gap:6px;
    align-items:center;

    background:#181818;
    border-radius:9px;
    padding:7px;
}

.money-image{
    width:50px;
    height:38px;
    object-fit:contain;
}

.money-label{
    font-weight:800;
}

.money-small-button{
    width:36px;
    height:36px;
    padding:0;
    background:#444;
    color:#fff;
}

.money-count{
    text-align:center;
    font-weight:900;
    min-width:30px;
}

.selected-money{
    background:#111;
    border-radius:10px;
    padding:11px;
    margin:14px 0 10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.selected-money-value{
    font-weight:900;
}

.money-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.money-buttons button{
    background:#fff;
    color:#111;
}


/* =========================
   사회복지기금
========================= */

.welfare-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #444;
}

.welfare-title{
    font-weight:900;
    margin-bottom:8px;
}

.welfare-fund{
    background:#111;
    border-radius:9px;
    padding:10px;
    margin-bottom:8px;
}

.welfare-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.welfare-buttons button{
    background:#444;
    color:#fff;
}


/* =========================
   모바일
========================= */

@media(max-width:600px){

    .pieces{
        grid-template-columns:repeat(3,1fr);
    }

    #turnOrder{
        top:auto;
        bottom:80px;
        left:10px;
        min-width:135px;
        padding:8px;
    }

    #turnControls{
        bottom:10px;
    }

    #moneyToggleButton{
        top:10px;
        right:10px;
    }

    #moneyPanel{
        top:10px;
        right:10px;
        max-height:calc(100vh - 20px);
    }

    .dice{
        width:75px;
        height:75px;
    }

    #diceArea{
        gap:8px;
    }
}
</style>
</head>


<body>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    onValue,
    onDisconnect,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAgifEo4ulWFIoqYppZjs60xqVAXK-u31U",

    authDomain:
        "dshs-marble.firebaseapp.com",

    databaseURL:
        "https://dshs-marble-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "dshs-marble",

    storageBucket:
        "dshs-marble.firebasestorage.app",

    messagingSenderId:
        "567950560406",

    appId:
        "1:567950560406:web:6470f6c91d8ad73e45c6b7"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =========================
   상태
========================= */

const state = {

    nickname: "",

    roomCode: "",

    playerId: "",

    hostId: null,

    selectedPiece: null,

    players: [],

    pieces: [1,2,3,4,5],

    isHost: false,

    turnOrder: [],

    currentTurnIndex: 0,

    gameStarted: false,

    diceRolling: false,

    lastDiceRollId: null,

    welfareFund: 0,

    dragging: false

};


/* =========================
   금액 선택
========================= */

const moneyCounts = {

    1: 0,
    2: 0,
    5: 0,
    10: 0,
    50: 0

};


/* =========================
   DOM
========================= */

const $ =
    id => document.getElementById(id);


/* =========================
   플레이어 ID
========================= */

function getPlayerId(){

    let id =
        localStorage.getItem(
            "dshsMarblePlayerId"
        );


    if(!id){

        id =
            "player_" +
            Math.random()
                .toString(36)
                .substring(2) +
            Date.now()
                .toString(36);


        localStorage.setItem(
            "dshsMarblePlayerId",
            id
        );

    }


    return id;

}


/* =========================
   금액 표시
========================= */

function formatMoney(value){

    const manwon =
        Number(value || 0) / 10000;


    return (
        manwon.toLocaleString("ko-KR") +
        "만원"
    );

}


/* =========================
   방 코드
========================= */

function makeRoomCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";


    for(let i = 0; i < 6; i++){

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }


    return code;

}


/* =========================
   닉네임
========================= */

function getNickname(){

    return $("nickname")
        .value
        .trim();

}


/* =========================
   방 만들기
========================= */

async function createRoom(){

    const nickname =
        getNickname();


    if(!nickname){

        $("loginError").textContent =
            "닉네임을 입력해";

        return;

    }


    try{

        state.playerId =
            getPlayerId();


        state.nickname =
            nickname;


        let code;
        let exists = true;


        for(
            let i = 0;
            i < 20 && exists;
            i++
        ){

            code =
                makeRoomCode();


            const snapshot =
                await get(
                    ref(
                        db,
                        `rooms/${code}`
                    )
                );


            exists =
                snapshot.exists();

        }


        if(exists){

            throw new Error(
                "방 코드 생성에 실패했어"
            );

        }


        state.roomCode =
            code;


        state.hostId =
            state.playerId;


        state.isHost =
            true;


        await set(

            ref(
                db,
                `rooms/${code}`
            ),

            {

                hostId:
                    state.playerId,

                gameStarted:
                    false,

                createdAt:
                    Date.now(),

                dice1:
                    1,

========================= */

async function joinRoom(){

    const nickname =
        getNickname();


    const code =
        $("roomInput")
            .value
            .trim()
            .toUpperCase();


    if(!nickname){

        $("loginError").textContent =
            "닉네임을 입력해";

        return;

    }


    if(code.length !== 6){

        $("loginError").textContent =
            "방 코드는 6자리야";

        return;

    }


    try{

        state.playerId =
            getPlayerId();


        const roomRef =
            ref(
                db,
                `rooms/${code}`
            );


        const snapshot =
            await get(roomRef);


        if(!snapshot.exists()){

            $("loginError").textContent =
                "존재하지 않는 방이야";

            return;

        }


        const data =
            snapshot.val();


        if(data.gameStarted){

            $("loginError").textContent =
                "이미 게임이 시작됐어";

            return;

        }


        const players =
            data.players || {};


        if(
            Object.keys(players).length >= 5
        ){

            $("loginError").textContent =
                "방이 가득 찼어";

            return;

        }


        state.roomCode =
            code;


        state.nickname =
            nickname;


        state.hostId =
            data.hostId || null;


        state.isHost =
            state.hostId ===
            state.playerId;


        await update(

            ref(
                db,
                `rooms/${code}/players/${state.playerId}`
            ),

            {

                playerId:
                    state.playerId,

                nickname:
                    nickname,

                piece:
                    null,

                x:
                    50,

                y:
                    50,

                balance:
                    2900000,

                joinedAt:
                    Date.now()

            }

        );


        await onDisconnect(
            ref(
                db,
                `rooms/${code}/players/${state.playerId}`
            )
        ).remove();


        enterRoom();


    }catch(error){

        console.error(error);


        $("loginError").textContent =
            "방에 들어갈 수 없어\n" +
            error.message;

    }

}

/* =========================
   실시간 방 감시
========================= */

function watchRoom(){

    const roomRef =
        ref(
            db,
            `rooms/${state.roomCode}`
        );


    onValue(
        roomRef,
        snapshot => {

            if(!snapshot.exists()){

                alert(
                    "방이 삭제됐어"
                );


                location.reload();


                return;

            }


            const data =
                snapshot.val();


            state.hostId =
                data.hostId || null;


            state.isHost =
                state.hostId ===
                state.playerId;


            state.players =
                Object.values(
                    data.players || {}
                );


            state.turnOrder =
                data.turnOrder || [];


            state.currentTurnIndex =
                data.currentTurnIndex || 0;


            state.gameStarted =
                !!data.gameStarted;


            state.diceRolling =
                !!data.diceRolling;


            state.welfareFund =
                data.welfareFund || 0;


            if(state.gameStarted){

                showGame();

            }else{

                showRoom();

            }


            renderPlayers();

            renderPieceSelection();

            renderMoneyPlayers();

            renderTurnOrder();

            renderTurnControls();

            renderGamePieces();

            updateSelectedMoney();


            $("welfareFund")
                .textContent =
                formatMoney(
                    state.welfareFund
                );


            const dice1 =
                data.dice1 || 1;


            const dice2 =
                data.dice2 || 1;


            $("dice1").src =
                `dice/dice${dice1}.png`;


            $("dice2").src =
                `dice/dice${dice2}.png`;


            const rollId =
                data.diceRollId;


            if(
                rollId &&
                rollId !==
                state.lastDiceRollId
            ){

                state.lastDiceRollId =
                    rollId;


                animateDice(
                    dice1,
                    dice2
                );

            }

        },

        error => {

            console.error(error);


            $("loginError").textContent =
                "Firebase 오류: " +
                error.message;

        }

    );

}

function renderPlayers(){

    const container =
        $("players");


    container.innerHTML = "";


    const sorted =
        [...state.players]
            .sort(
                (a,b) => {

                    if(
                        a.playerId ===
                        state.playerId
                    ){

                        return -1;

                    }


                    if(
                        b.playerId ===
                        state.playerId
                    ){

                        return 1;

                    }


                    return (
                        (a.joinedAt || 0) -
                        (b.joinedAt || 0)
                    );

                }
            );


    for(
        const player
        of sorted
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "player";


        const left =
            document.createElement(
                "div"
            );


        left.className =
            "player-left";


        const name =
            document.createElement(
                "span"
            );


        name.textContent =
            player.nickname ||
            "이름 없음";


        if(
            player.playerId ===
            state.playerId
        ){

            name.classList.add(
                "player-me"
            );

        }


        left.appendChild(name);


        if(
            player.playerId ===
            state.playerId
        ){

            const me =
                document.createElement(
                    "span"
                );


            me.className =
                "host-badge";


            me.textContent =
                "나";


            left.appendChild(me);

        }


        if(
            player.playerId ===
            state.hostId
        ){

            const host =
                document.createElement(
                    "span"
                );


            host.className =
                "host-badge";


            host.textContent =
                "방장";


            left.appendChild(host);

        }


        const right =
            document.createElement(
                "span"
            );


        right.className =
            "player-piece";


        right.textContent =
            player.piece
                ? `P${player.piece}`
                : "말 미선택";


        div.append(
            left,
            right
        );


        container.appendChild(div);

    }


    const everyoneHasPiece =
        state.players.length > 0 &&
        state.players.every(
            player =>
                !!player.piece
        );


    $("startBtn").disabled =
        !state.isHost ||
        !everyoneHasPiece;

}

   말 선택
========================= */

function renderPieceSelection(){

    const container =
        $("pieces");


    container.innerHTML = "";


    const usedByOthers =
        state.players
            .filter(
                player =>
                    player.playerId !==
                    state.playerId
            )
            .map(
                player =>
                    Number(player.piece)
            )
            .filter(
                Boolean
            );


    const me =
        state.players.find(
            player =>
                player.playerId ===
                state.playerId
        );


    const myPiece =
        me?.piece
            ? Number(me.piece)
            : null;


    state.selectedPiece =
        myPiece;


    for(
        const piece
        of state.pieces
    ){

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "piece";


        const isMine =
            piece ===
            myPiece;


        const isUsed =
            usedByOthers.includes(
                piece
            );


        if(isMine){

            div.classList.add(
                "selected"
            );

        }


        if(isUsed){

            div.classList.add(
                "used"
            );

        }


        const img =
            document.createElement(
                "img"
            );


        img.src =
            `P/P${piece}.png`;


        img.alt =
            `P${piece}`;


        img.onerror =
            () => {

                img.style.display =
                    "none";

            };


        const label =
            document.createElement(
                "small"
            );


        if(isMine){

            label.textContent =
                "내 말";

        }else if(isUsed){

            label.textContent =
                "사용 중";

        }else{

            label.textContent =
                `P${piece}`;

        }


        div.append(
            img,
            label
        );


        if(!isUsed){

            div.addEventListener(
                "click",
                () =>
                    selectPiece(piece)
            );

        }


        container.appendChild(div);

    }

}


/* =========================
   말 선택 저장
========================= */

async function selectPiece(piece){

    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players`
                ),

                players => {

                    if(!players){

                        return;

                    }


                    const me =
                        players[
                            state.playerId
                        ];


                    if(!me){

                        return;

                    }


                    for(
                        const [
                            playerId,
                            player
                        ]
                        of Object.entries(
                            players
                        )
                    ){

                        if(
                            playerId !==
                            state.playerId &&
                            Number(player.piece) ===
                            Number(piece)
                        ){

                            return;

                        }

                    }


                    me.piece =
                        piece;


                    return players;

                }

            );


        if(!result.committed){

            return;

        }


        state.selectedPiece =
            piece;


        renderPieceSelection();

        renderPlayers();


    }catch(error){

        console.error(
            "말 선택 오류:",
            error
        );


        $("roomStatus").textContent =
            "말 선택에 실패했어: " +
            error.message;

    }

}


/* =========================
   게임 시작
========================= */

async function startGame(){

    if(!state.isHost){

        return;

    }


    try{

        await runTransaction(

            ref(
                db,
                `rooms/${state.roomCode}`
            ),

            room => {

                if(!room){

                    return;

                }


                if(
                    room.hostId !==
                    state.playerId
                ){

                    return;

                }


                if(room.gameStarted){

                    return;

                }


                const players =
                    Object.values(
                        room.players || {}
                    );


                if(
                    players.length === 0
                ){

                    return;

                }


                if(
                    !players.every(
                        player =>
                            !!player.piece
                    )
                ){

                    return;

                }


                const order =
                    players
                        .map(
                            player =>
                                player.playerId
                        )
                        .sort(
                            () =>
                                Math.random() -
                                0.5
                        );


                room.gameStarted =
                    true;


                room.turnOrder =
                    order;


                room.currentTurnIndex =
                    0;


                room.dice1 =
                    1;


                room.dice2 =
                    1;


                room.diceRolling =
                    false;


                room.diceRollId =
                    null;


                room.welfareFund =
                    0;


                return room;

            }

        );


    }catch(error){

        console.error(
            error
        );

    }

}

){

    if(!player.piece){

        );

/* =========================
   말 드래그
========================= */

function enablePieceDrag(img){

    let dragging =
        false;


    function getPosition(event){

        const board =
            document.querySelector(
                ".board-wrap"
            );


        const rect =
            board.getBoundingClientRect();


        let x =
            (
                (event.clientX - rect.left)
                /
                rect.width
            ) * 100;


        let y =
            (
                (event.clientY - rect.top)
                /
                rect.height
            ) * 100;


        x =
            Math.max(
                0,
                Math.min(
                    100,
                    x
                )
            );


        y =
            Math.max(
                0,
                Math.min(
                    100,
                    y
                )
            );


        return {
            x,
            y
        };

    }


    img.addEventListener(
        "pointerdown",
        event => {

            dragging =
                true;


            state.dragging =
                true;


            img.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    img.addEventListener(
        "pointermove",
        event => {

            if(!dragging){

                return;

            }


            const {
                x,
                y
            } =
                getPosition(event);


            img.style.left =
                `${x}%`;


            img.style.top =
                `${y}%`;

        }
    );


    img.addEventListener(
        "pointerup",
        async event => {

            if(!dragging){

                return;

            }


            dragging =
                false;


            state.dragging =
                false;


            const {
                x,
                y
            } =
                getPosition(event);


            img.style.left =
                `${x}%`;


            img.style.top =
                `${y}%`;


            try{

                await update(

                    ref(
                        db,
                        `rooms/${state.roomCode}/players/${state.playerId}`
                    ),

                    {
                        x,
                        y
                    }

                );

            }catch(error){

                console.error(
                    "말 위치 저장 오류:",
                    error
                );

            }

        }
    );

}

/* =========================
   주사위
========================= */

window.rollDice =
async function(){

    if(state.diceRolling){

        return;

    }


    if(!state.gameStarted){

        return;

    }


    const currentPlayerId =
        state.turnOrder[
            state.currentTurnIndex
        ];


    if(
        currentPlayerId !==
        state.playerId
    ){

        return;

    }


    const final1 =
        randomDiceValue();


    const final2 =
        randomDiceValue();


    /*
      두 주사위가 같은 숫자인지
      미리 저장한다.
    */

    const isDouble =
        final1 === final2;


    state.diceRolling =
        true;


    renderTurnControls();


    try{

        await update(

            ref(
                db,
                `rooms/${state.roomCode}`
            ),

            {

                dice1:
                    final1,

                dice2:
                    final2,

                diceRolling:
                    true,

                diceRollId:
                    Date.now()

            }

        );


        setTimeout(
            async () => {

                try{

                    await runTransaction(

                        ref(
                            db,
                            `rooms/${state.roomCode}`
                        ),

                        room => {

                            if(!room){

                                return;

                            }


                            if(
                                !room.diceRolling
                            ){

                                return;

                            }


                            const order =
                                room.turnOrder ||
                                [];


                            if(
                                order.length === 0
                            ){

                                room.diceRolling =
                                    false;


                                return room;

                            }


                            /*
                              주사위 굴리기가 끝났다는
                              표시를 한다.
                            */

                            room.diceRolling =
                                false;


                            /*
                              더블이면
                              currentTurnIndex를
                              변경하지 않는다.

                              따라서 현재 플레이어가
                              한 번 더 굴릴 수 있다.
                            */

                            if(isDouble){

                                return room;

                            }


                            /*
                              더블이 아니면
                              다음 플레이어에게
                              턴을 넘긴다.
                            */

                            room.currentTurnIndex =
                                (
                                    (
                                        room.currentTurnIndex ||
                                        0
                                    ) + 1
                                )
                                %
                                order.length;


                            return room;

                        }

                    );


                }catch(error){

                    console.error(
                        error
                    );

                }

            },
            1300
        );


    }catch(error){

        console.error(
            error
        );


        state.diceRolling =
            false;


        renderTurnControls();

    }

};


function randomDiceValue(){

    return (
        Math.floor(
            Math.random() * 6
        ) + 1
    );

}


function animateDice(
    final1,
    final2
){

    let count = 0;


    const timer =
        setInterval(
            () => {

                $("dice1").src =
                    `dice/dice${randomDiceValue()}.png`;


                $("dice2").src =
                    `dice/dice${randomDiceValue()}.png`;


                count++;


                if(count >= 8){

                    clearInterval(
                        timer
                    );


                    $("dice1").src =
                        `dice/dice${final1}.png`;


                    $("dice2").src =
                        `dice/dice${final2}.png`;

                }

            },
            100
        );

}

        }


        const balance =
            document.createElement(
                "div"
            );


        balance.className =
            "money-player-balance";


        balance.textContent =
            formatMoney(
                player.balance || 0
            );


        row.append(
            name,
            balance
        );


        container.appendChild(
            row
        );

    }

}


/* =========================
   지폐 수량
========================= */

window.changeMoneyCount =
function(
    value,
    change
){

    moneyCounts[value] =
        Math.max(
            0,
            moneyCounts[value] +
            change
        );


    updateMoneyCountDisplays();

    updateSelectedMoney();

};


function updateMoneyCountDisplays(){

    for(
        const value
        of [1,2,5,10,50]
    ){

        const element =
            $(`moneyCount${value}`);


        if(element){

            element.textContent =
                moneyCounts[value];

        }

    }

}


/* =========================
   선택 금액 계산
========================= */

function getSelectedMoney(){

    return (

        moneyCounts[1] * 10000 +

        moneyCounts[2] * 20000 +

        moneyCounts[5] * 50000 +

        moneyCounts[10] * 100000 +

        moneyCounts[50] * 500000

    );

}


function updateSelectedMoney(){

    $("selectedMoney")
        .textContent =
        formatMoney(
            getSelectedMoney()
        );


    updateMoneyCountDisplays();

}


/* =========================
   선택 초기화
========================= */

function resetMoneyCounts(){

    for(
        const value
        of [1,2,5,10,50]
    ){

        moneyCounts[value] =
            0;

    }


    updateMoneyCountDisplays();

    updateSelectedMoney();

}


/* =========================
   돈 받기
========================= */

window.receiveMoney =
async function(){

    const amount =
        getSelectedMoney();


    if(amount <= 0){

        return;

    }


    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players/${state.playerId}/balance`
                ),

                balance =>
                    (balance || 0) +
                    amount

            );


        if(result.committed){

            resetMoneyCounts();

        }

    }catch(error){

        console.error(
            "돈 받기 오류:",
            error
        );

    }

};


/* =========================
   돈 내기
========================= */

window.payMoney =
async function(){

    const amount =
        getSelectedMoney();


    if(amount <= 0){

        return;

    }


    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}/players/${state.playerId}/balance`
                ),

                balance => {

                    balance =
                        balance || 0;


                    if(
                        balance <
                        amount
                    ){

                        return;

                    }


                    return (
                        balance -
                        amount
                    );

                }

            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );


            return;

        }


        resetMoneyCounts();

    }catch(error){

        console.error(
            "돈 내기 오류:",
            error
        );

    }

};


/* =========================
   사회복지기금 내기
========================= */

window.payWelfareFund =
async function(){

    const amount =
        150000;


    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}`
                ),

                room => {

                    if(!room){

                        return;

                    }


                    const player =
                        room.players?.[
                            state.playerId
                        ];


                    if(!player){

                        return;

                    }


                    const balance =
                        player.balance ||
                        0;


                    if(
                        balance <
                        amount
                    ){

                        return;

                    }


                    player.balance =
                        balance -
                        amount;


                    room.welfareFund =
                        (
                            room.welfareFund ||
                            0
                        ) +
                        amount;


                    return room;

                }

            );


        if(!result.committed){

            alert(
                "잔액이 부족해"
            );

        }

    }catch(error){

        console.error(
            "기금 내기 오류:",
            error
        );

    }

};


/* =========================

========================= */

window.receiveWelfareFund =
async function(){

    try{

        const result =
            await runTransaction(

                ref(
                    db,
                    `rooms/${state.roomCode}`
                ),

                room => {

                    if(!room){

                        return;

                    }


                    const fund =
                        room.welfareFund ||
                        0;


                    if(fund <= 0){

                        return;

                    }


                    const player =
                        room.players?.[
                            state.playerId
                        ];


                    if(!player){

                        return;

                    }


                    player.balance =
                        (
                            player.balance ||
                            0
                        ) +
                        fund;


                    room.welfareFund =
                        0;


                    return room;

                }

            );


        if(!result.committed){

            return;

        }

    }catch(error){

        console.error(
            "기금 받기 오류:",
            error
        );

    }

};
